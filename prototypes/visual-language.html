<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers "What does ledgr look like?" (issue #2), round 4.
  Rounds 1 to 3 were rejected as too decorative. The brief is now GitHub-like: calm, practical,
  professional, easy on the eye. Six variants share one Primer-style token set and differ in layout.
  Switch with the strip at the top (or ← →). Every variant must work at phone width.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledgr visual language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
/* Navigation and tabs show hover with a background; only text links underline. */
.unav a:hover, .B-nav a:hover, .E-nav a:hover, .M-tabs a:hover, .F-tabs a:hover, .mt a:hover, .btn:hover { text-decoration: none; }
/* An underline across an icon and a gap looks broken, so links with an icon underline only their text. */
a:has(svg):hover { text-decoration: none; }
a:has(svg):hover > span { text-decoration: underline; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 6px; }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }

/* ---------- Primer-style tokens; dark mode is true black with GitHub's dark greys for structure ---------- */
body {
  --bg: light-dark(#ffffff, #000000);
  --subtle: light-dark(#f6f8fa, #0d1117);
  --muted-bg: light-dark(#eff2f5, #151b23);
  --border: light-dark(#d1d9e0, #30363d);
  --border-muted: light-dark(#e3e8ed, #21262d);
  --fg: light-dark(#1f2328, #e6edf3);
  --muted: light-dark(#59636e, #9198a1);
  --accent: light-dark(#0969da, #4493f8);
  --good: light-dark(#1a7f37, #3fb950);
  --bad: light-dark(#d1242f, #f85149);
  --attention: light-dark(#9a6700, #d29922);
  --primary: light-dark(#1f883d, #238636);
  --primary-hover: light-dark(#1c8139, #29903b);
  --btn: light-dark(#f6f8fa, #212830);
  --btn-hover: light-dark(#eff2f5, #262c36);
  --brand-ink: light-dark(#121418, #ece8df);
  --brand-green: light-dark(#13785a, #5fcb9f);
  --shadow: light-dark(0 1px 0 rgba(31,35,40,.04), none);
  --overlay-shadow: light-dark(0 8px 24px rgba(66,74,83,.2), 0 0 0 1px #30363d, 0 16px 32px rgba(0,0,0,.85));
  font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5;
  background: var(--bg); color: var(--fg);
  -webkit-font-smoothing: antialiased;
}
.logo { height: 24px; width: auto; display: block; color: var(--brand-ink); flex: none; }

/* Mona Sans' tabular figures are monospace with dotted zeros; its proportional figures read calmer. */
.num { white-space: nowrap; flex: none; }
.num .dec { color: var(--muted); }
.num.good, .num.good .dec { color: var(--good); }
.num.bad, .num.bad .dec { color: var(--bad); }
.num .suf { color: var(--muted); font-weight: 400; margin-left: 4px; }
.num.mask { color: var(--muted); letter-spacing: .1em; }

/* Box: GitHub's bordered container with a subtle header */
.box { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.box-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--subtle); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; }
.box-h h2, .box-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.box-r { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border-muted); }
.box-h + .box-r, .box > .box-r:first-child { border-top: 0; }
.box-r:hover { background: var(--subtle); }
.box-r .main { flex: 1; min-width: 0; }
.box-r .main .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box-r .main .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box-f { padding: 8px 16px; border-top: 1px solid var(--border-muted); text-align: center; font-size: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--btn); color: var(--fg); font-weight: 500; font-size: 14px; white-space: nowrap; box-shadow: var(--shadow); flex: none; }
.btn:hover { background: var(--btn-hover); text-decoration: none; }
.btn.primary { background: var(--primary); border-color: rgba(31,35,40,.15); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.sm { height: 28px; padding: 0 8px; font-size: 12px; }
.btn.icon { width: 32px; padding: 0; }
.btn.invisible { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted); }
.counter { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--muted-bg); border: 1px solid transparent; font-size: 12px; font-weight: 500; line-height: 18px; text-align: center; color: var(--fg); }
.label { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid color-mix(in srgb, var(--hue) 45%, transparent); background: color-mix(in srgb, var(--hue) 12%, transparent); color: light-dark(color-mix(in srgb, var(--hue) 80%, #000), color-mix(in srgb, var(--hue) 70%, #fff)); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--hue); flex: none; }
.oct { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--subtle); border: 1px solid var(--border); color: var(--muted); flex: none; }
.muted { color: var(--muted); }
.h-big { font-size: 32px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.h-mid { font-size: 20px; font-weight: 600; }

.progress { height: 8px; border-radius: 6px; background: var(--muted-bg); overflow: hidden; display: flex; }
.progress i { display: block; height: 100%; }
.bud { padding: 12px 16px; border-top: 1px solid var(--border-muted); }
.box-h + .bud { border-top: 0; }
.bud .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bud .top .n { flex: 1; font-weight: 600; }
.bud .s { font-size: 12px; color: var(--muted); margin-top: 4px; }

.input, .select, .textarea { width: 100%; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 14px; box-shadow: inset 0 1px 0 light-dark(rgba(208,215,222,.2), transparent); }
.textarea { height: 64px; padding: 6px 12px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-weight: 600; font-size: 14px; }
.field small { color: var(--muted); font-size: 12px; }
.lead { position: relative; }
.lead > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.lead .input { padding-left: 28px; }
.segc { display: flex; background: var(--muted-bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
.segc button { flex: 1; height: 26px; border: 1px solid transparent; background: transparent; border-radius: 5px; font-weight: 500; color: var(--fg); }
.segc button.on { background: var(--bg); border-color: var(--border); font-weight: 600; box-shadow: var(--shadow); }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fgrid .full { grid-column: 1 / -1; }

.dialog-bg { position: fixed; inset: 0; z-index: 40; background: light-dark(rgba(31,35,40,.5), rgba(1,4,9,.8)); }
.dialog { position: fixed; z-index: 41; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: var(--bg); border-radius: 12px; box-shadow: var(--overlay-shadow); }
.dialog .dh { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border-muted); }
.dialog .dh h3 { margin: 0; font-size: 14px; font-weight: 600; }
.dialog .db { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 16px; border-top: 1px solid var(--border-muted); }

/* App header, shared by A to E */
.hdr { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: var(--subtle); border-bottom: 1px solid var(--border); }
.hdr .crumb { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.hdr .crumb .muted { font-weight: 400; }
.hdr .sp { flex: 1; }
.hdr .search { width: 280px; position: relative; }
.hdr .search svg { position: absolute; left: 8px; top: 8px; color: var(--muted); }
.hdr .search .input { padding-left: 30px; height: 32px; }
.hdr .search kbd { position: absolute; right: 8px; top: 6px; font: 11px/18px inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--muted-bg); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); flex: none; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }

.unav { isolation: isolate; display: flex; gap: 8px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--subtle); overflow-x: auto; scrollbar-width: none; }
.unav a { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 48px; color: var(--fg); white-space: nowrap; border-bottom: 2px solid transparent; position: relative; }
.unav a:hover { text-decoration: none; }
.unav a:hover::before { content: ""; position: absolute; inset: 8px 0; background: var(--btn-hover); border-radius: 6px; z-index: -1; }
.unav a.on { font-weight: 600; border-bottom-color: #fd8c73; }
.unav a svg { color: var(--muted); }

.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* ================= A: Repository ================= */
.A-title { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.A-title h1 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; }
.A-grid { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 24px; }
.A-side section { padding: 16px 0; border-top: 1px solid var(--border-muted); }
.A-side section:first-child { padding-top: 0; border-top: 0; }
.A-side h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
.A-side .li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.A-side .li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.A-side .chart { height: 48px; margin-top: 12px; }
.A-filter { display: flex; gap: 8px; }
.A-rows .box-r .label { margin-left: 4px; }
.A-rows .date { color: var(--muted); font-size: 12px; width: 76px; text-align: right; flex: none; }
@media (max-width: 860px) { .A-grid { grid-template-columns: 1fr; } .A-side { order: -1; } .A-rows .date, .A-rows .acct { display: none; } }

/* ================= B: Settings ================= */
.B-grid { display: grid; grid-template-columns: 256px minmax(0, 1fr); gap: 32px; }
.B-nav h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 8px 4px; }
.B-nav h4:first-child { margin-top: 0; }
.B-nav a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); position: relative; }
.B-nav a:hover { background: var(--btn-hover); text-decoration: none; }
.B-nav a.on { background: var(--muted-bg); font-weight: 600; }
.B-nav a.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px; border-radius: 6px; background: var(--accent); }
.B-nav a svg { color: var(--muted); }
.B-nav a .counter { margin-left: auto; }
.B-mnav { display: none; }
.B-sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; margin: 32px 0 16px; border-bottom: 1px solid var(--border-muted); }
.B-sub:first-child { margin-top: 0; }
.B-sub h2 { margin: 0; font-size: 24px; font-weight: 400; }
.B-sub h3 { margin: 0; font-size: 20px; font-weight: 400; }
.B-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.B-stat { padding: 16px; }
.B-stat .l { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.B-stat .v { font-size: 24px; font-weight: 600; margin-top: 4px; }
.B-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .B-grid { grid-template-columns: 1fr; gap: 16px; } .B-nav { display: none; } .B-mnav { display: block; } .B-stats, .B-two { grid-template-columns: 1fr; } }

/* ================= C: Dashboard ================= */
.C-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; gap: 24px; }
.C-left h2, .C-right h2, .C-feed h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.C-left .input { margin-bottom: 8px; }
.C-left .li { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.C-left .li .n { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.C-left .grp { font-size: 12px; color: var(--muted); margin: 12px 0 2px; display: flex; justify-content: space-between; }
.C-day { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; }
.C-day:first-of-type { margin-top: 0; }
.C-tl { position: relative; padding-left: 44px; }
.C-tl::before { content: ""; position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: var(--border-muted); }
.C-ev { position: relative; margin-bottom: 12px; }
.C-ev .oct { position: absolute; left: -44px; top: 8px; background: var(--bg); }
.C-ev .box { padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
.C-ev .main { flex: 1; min-width: 0; }
.C-ev .main .s { color: var(--muted); font-size: 12px; }
.C-right .box { margin-bottom: 16px; }
.C-nw { padding: 16px; }
.C-nw .chart { height: 56px; margin-top: 12px; }
.C-up { display: flex; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border-muted); align-items: start; }
.C-up:first-of-type { border-top: 0; }
.C-up svg { margin-top: 3px; color: var(--muted); }
.C-up .s { color: var(--muted); font-size: 12px; }
@media (max-width: 1100px) { .C-grid { grid-template-columns: minmax(0, 1fr) 300px; } .C-left { grid-column: 1 / -1; order: 3; } }
@media (max-width: 760px) { .C-grid { grid-template-columns: 1fr; } .C-right { order: -1; } }

/* ================= D: Table ================= */
.D-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.D-head h1 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; }
.D-stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 16px; }
.D-stats > div { padding: 12px 16px; border-left: 1px solid var(--border-muted); }
.D-stats > div:first-child { border-left: 0; }
.D-stats .l { font-size: 12px; color: var(--muted); }
.D-stats .v { font-size: 20px; font-weight: 600; }
.D-new { padding: 16px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px 16px; align-items: end; }
.D-new .act { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
.D-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.D-bar .q { flex: 1; min-width: 200px; position: relative; }
.D-bar .q svg { position: absolute; left: 8px; top: 8px; color: var(--muted); }
.D-bar .q .input { padding-left: 30px; }
.D-tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.D-tbl th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 10px 16px; background: var(--subtle); border-bottom: 1px solid var(--border); }
.D-tbl th:first-child { border-radius: 6px 0 0 0; } .D-tbl th:last-child { border-radius: 0 6px 0 0; }
.D-tbl td { padding: 10px 16px; border-top: 1px solid var(--border-muted); vertical-align: middle; }
.D-tbl tr:first-child td { border-top: 0; }
.D-tbl tbody tr:hover td { background: var(--subtle); }
.D-tbl .r { text-align: right; }
.D-tbl .who { font-weight: 600; }
.D-tbl .who small { display: none; color: var(--muted); font-weight: 400; font-size: 12px; }
.D-tbl input[type=checkbox] { margin: 0; }
.D-pag { display: flex; justify-content: center; gap: 4px; margin-top: 16px; }
@media (max-width: 860px) { .D-stats { grid-template-columns: 1fr 1fr; } .D-stats > div:nth-child(3) { border-left: 0; } .D-stats > div:nth-child(n+3) { border-top: 1px solid var(--border-muted); } .D-tbl .hide-sm { display: none; } .D-tbl .who small { display: block; } .D-new { grid-template-columns: 1fr 1fr; } }

/* ================= E: Insights ================= */
.E-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; }
.E-nav a { display: block; padding: 8px 12px; border-left: 2px solid transparent; color: var(--fg); }
.E-nav a.on { border-left-color: #fd8c73; font-weight: 600; background: var(--subtle); }
.E-nav a:hover { text-decoration: none; background: var(--subtle); }
.E-period { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.E-period h1 { margin: 0; font-size: 20px; font-weight: 600; }
.E-pulse { display: grid; grid-template-columns: 1fr 1fr; }
.E-pulse > div { padding: 16px; }
.E-pulse > div + div { border-left: 1px solid var(--border-muted); }
.E-pulse .progress { height: 8px; margin-bottom: 8px; }
.E-pulse .v { font-size: 20px; font-weight: 600; }
.E-pulse .l { color: var(--muted); font-size: 12px; }
.E-sum { padding: 16px; border-top: 1px solid var(--border-muted); color: var(--muted); }
.E-sum b { color: var(--fg); font-weight: 600; }
.E-heat { padding: 16px; overflow-x: auto; }
.E-heat .cells { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; }
.E-heat .cells i { border-radius: 2px; outline: 1px solid light-dark(rgba(31,35,40,.05), rgba(255,255,255,.05)); outline-offset: -1px; }
.E-heat .legend { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.E-heat .legend span { display: flex; gap: 3px; align-items: center; }
.E-heat .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.E-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 16px; }
.E-chart { padding: 16px; }
.E-chart .chart { height: 160px; }
.E-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
@media (max-width: 860px) { .E-grid { grid-template-columns: 1fr; } .E-nav { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); } .E-nav a { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; } .E-nav a.on { border-bottom-color: #fd8c73; background: none; } .E-row { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .E-pulse { grid-template-columns: 1fr; } .E-pulse > div + div { border-left: 0; border-top: 1px solid var(--border-muted); } }

/* ================= F: Mobile app ================= */
.F-app { max-width: 600px; margin: 0 auto; padding: 8px 16px 100px; }
.F-top { display: flex; align-items: center; justify-content: space-between; height: 52px; }
.F-top .r { display: flex; gap: 4px; }
.F-title { font-size: 28px; font-weight: 700; margin: 4px 0 12px; letter-spacing: -0.01em; }
.F-search { position: relative; margin-bottom: 20px; }
.F-search svg { position: absolute; left: 10px; top: 10px; color: var(--muted); }
.F-search .input { height: 36px; padding-left: 34px; background: var(--subtle); border-radius: 10px; }
.F-sec { font-size: 13px; font-weight: 600; color: var(--muted); margin: 20px 4px 8px; display: flex; justify-content: space-between; }
.F-list { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.F-li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border-muted); background: var(--bg); }
.F-li:first-child { border-top: 0; }
.F-li .ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; background: var(--hue); }
.F-li .main { flex: 1; min-width: 0; }
.F-li .main .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.F-li .chev { color: var(--muted); }

const accAmt = (a, o = {}) => amount(a.balance, { role: a.kind === "liability" ? "liability" : "balance", ...o });
const srDir = (t) => t.kind === "liability" ? `<span class="sr">${t.amount > 0 ? "Charged" : "Paid"}</span>` : "";
const txAmt = (t) => srDir(t) + amount(t.amount, { role: "change", kind: t.kind });
const txWho = (t) => t.party || "Card payment";
const txSub = (t) => t.note ? `${t.note} → ${t.account}` : t.account;
const ic = (name) => `<i data-lucide="${name}"></i>`;
const label = (n) => `<span class="label" style="--hue:${exp(n).hue}">${n}</span>`;
const dot = (n) => `<span class="dot" style="--hue:${exp(n).hue}"></span>`;
const byDay = (list) => [...new Set(list.map((t) => t.date))].map((d) => [d, list.filter((t) => t.date === d)]);
const NAV = [["Overview", "layout-grid"], ["Transactions", "arrow-left-right", 248], ["Drafts", "inbox", 3], ["Budgets", "pie-chart"], ["Accounts", "landmark", 8], ["Investments", "trending-up"], ["Goals", "target"]];

function chart(w, h, { fill = true } = {}) {
  const pad = 4, min = Math.min(...history), max = Math.max(...history);
  const pts = history.map((v, i) => [(i / (history.length - 1)) * w, pad + (1 - (v - min) / (max - min)) * (h - pad * 2)]);
  const d = "M" + pts.map((p) => p.join(",")).join(" L");
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${fill ? `<path d="${d} L${w},${h} L0,${h} Z" fill="var(--good)" fill-opacity=".08"/>` : ""}
    <path d="${d}" fill="none" stroke="var(--good)" stroke-width="1.75" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg></div>`;
}
const delta = () => `${amount(netWorthChange, { role: "change" })} <span class="muted">this month</span>`;
const pct = (b) => Math.min(100, (b.spent / b.budget) * 100);
const budgetRow = (b) => `<div class="bud"><div class="top">${dot(b.name)}<span class="n">${b.name}</span>${amount(b.budget - b.spent, { paise: false })}<span class="muted">${b.spent > b.budget ? "over" : "left"}</span></div>
  <div class="progress"><i style="width:${pct(b)}%;background:${b.spent > b.budget ? "var(--bad)" : exp(b.name).hue}"></i></div>
  <div class="s">${amount(b.spent, { paise: false })} of ${amount(b.budget, { paise: false })} spent</div></div>`;
const txRow = (t, { date = true, acct = true } = {}) => `<div class="box-r">${dot(t.to)}<div class="main"><div class="t">${txWho(t)}</div><div class="s">${date ? t.short + " · " : ""}${t.to}${acct ? " · " + txSub(t) : ""}</div></div>${txAmt(t)}</div>`;
const acctRow = (a) => `<div class="box-r"><span class="oct">${ic(a.icon)}</span><div class="main"><div class="t">${a.name}</div><div class="s">${a.sub}</div></div>${accAmt(a)}</div>`;

function renderE() {

  const acctLi = (a) => `<div class="G-acct">${ic(a.icon)}<span class="n">${a.name}</span>${accAmt(a, { paise: false })}</div>`;
  const hueAcct = (a) => a.kind === "liability" ? "#8250df" : a.icon === "trending-up" ? "#0969da" : a.icon === "home" ? "#9a6700" : "#1a7f37";
  const upcoming = [
    { icon: "inbox", hue: "#bc4c00", t: "3 Drafts to review", s: "From Quick Add", count: 3 },
    { icon: "credit-card", hue: "#8250df", t: "HDFC Regalia bill due", s: `22 Oct · ${amount(42816.4, { role: "liability", paise: false })}` },
    { icon: "utensils", hue: "#d1242f", t: "Eating out is over Budget", s: `by ${amount(1120, { paise: false })}` },
  ];

  const desk = `<div class="G-desk">
    ${header("Home")}
    <nav class="unav G-unav">${NAV.map(([n, i, c], k) => `<a href="#" class="${k ? "" : "on"}">${ic(i)}${n}${c ? `<span class="counter">${c}</span>` : ""}</a>`).join("")}</nav>
    <div class="G-shell">
      <nav class="B-nav G-nav">${groups.map(([h, items]) => `<h4>${h}</h4>${items.map(([n, i, c]) => `<a href="#" class="${n === "Home" ? "on" : ""}">${ic(i)}${n}${c ? `<span class="counter">${c}</span>` : ""}</a>`).join("")}`).join("")}</nav>
      <main>
        <div class="G-head"><h1>Home<span class="muted">Friday, 16 October</span></h1><button class="btn">${ic("calendar")} October ${ic("chevron-down")}</button></div>
        <div class="G-stats">
          <div class="box G-stat"><div class="l">${ic("scale")} Net Worth</div><div class="v">${amount(netWorth)}</div><div class="s">${delta()}</div>${chart(400, 36)}</div>
          <div class="box G-stat"><div class="l">${ic("arrow-up-right")} Spent in October</div><div class="v">${amount(month.spent, { paise: false })}</div><div class="s">${month.count} Transactions</div></div>
          <div class="box G-stat"><div class="l">${ic("arrow-down-left")} Received in October</div><div class="v">${amount(month.received, { paise: false })}</div><div class="s">${amount(month.received - month.spent, { paise: false })} kept</div></div>
        </div>
        <div class="G-split">
          <section class="C-feed">
            <h2>Activity <a href="#" style="font-size:14px;font-weight:400">View all Transactions</a></h2>
            <div class="C-tl">
            ${byDay(txns).map(([d, ts]) => `<div class="C-day">${d}</div>${ts.map((t) => `<div class="C-ev"><span class="oct">${ic(exp(t.to).icon)}</span><div class="box"><div class="main"><div>${verb(t)} <b>${txWho(t)}</b></div><div class="s">${label(t.to)} <span style="margin-left:6px">${txSub(t)}</span></div></div>${txAmt(t)}</div></div>`).join("")}`).join("")}
            </div>
          </section>
          <aside class="G-side">
            <div class="box"><div class="box-h"><h3>Needs attention</h3><span class="counter">3</span></div>
              ${upcoming.map((u) => `<div class="C-up">${ic(u.icon)}<div><div>${u.t}</div><div class="s">${u.s}</div></div></div>`).join("")}</div>
            <div class="box"><div class="box-h"><h3>Accounts</h3><a href="#">Manage</a></div>
              <div class="G-grp"><span>Assets</span>${amount(sum(assets), { paise: false })}</div>${assets.map(acctLi).join("")}
              <div class="G-grp"><span>Liabilities</span>${amount(sum(liabilities), { role: "liability", paise: false })}</div>${liabilities.map(acctLi).join("")}</div>
            <div class="box"><div class="box-h"><h3>October budgets</h3><span class="muted">16 days left</span></div>${budgets.slice(0, 3).map(budgetRow).join("")}</div>
          </aside>
        </div>
      </main>
    </div>
  </div>`;

  const mob = `<div class="G-mob">
    <div class="M-bar">${LOGO}<div class="r"><button class="M-ib" aria-label="Search">${ic("search")}</button><button class="M-ib" aria-label="Drafts">${ic("inbox")}<b>3</b></button></div></div>
    <div class="M-title"><h1>Home</h1><div>Friday, 16 October</div></div>
    <div class="M-card">
      <div class="M-nw"><div class="l">Net Worth</div><div class="v">${amount(netWorth)}</div><div style="font-size:13px">${delta()}</div>${chart(360, 52)}</div>
      <div class="M-pair"><div><div class="l">Spent in October</div>${amount(month.spent, { paise: false })}</div><div><div class="l">Received</div>${amount(month.received, { paise: false })}</div></div>
    </div>
    <div class="M-sec"><span>Needs attention</span></div>
    <div class="M-card">${upcoming.map((u) => `<div class="M-row"><span class="ic" style="--hue:${u.hue}">${ic(u.icon)}</span><div class="main"><div class="t">${u.t}</div><div class="s">${u.s}</div></div>${ic("chevron-right")}</div>`).join("")}</div>
    <div class="M-sec"><span>Accounts</span><a href="#">See all</a></div>
    <div class="M-card">
      ${assets.slice(0, 4).map((a) => `<div class="M-row"><span class="ic" style="--hue:${hueAcct(a)}">${ic(a.icon)}</span><div class="main"><div class="t">${a.name}</div><div class="s">${a.sub}</div></div>${accAmt(a, { paise: false })}</div>`).join("")}
      <div class="M-grp"><span>Liabilities</span><span>${amount(sum(liabilities), { role: "liability", paise: false })} owed</span></div>
      ${liabilities.map((a) => `<div class="M-row"><span class="ic" style="--hue:${hueAcct(a)}">${ic(a.icon)}</span><div class="main"><div class="t">${a.name}</div><div class="s">${a.sub}</div></div>${accAmt(a, { paise: false })}</div>`).join("")}
    </div>
    <div class="M-sec"><span>October budgets</span><a href="#">16 days left</a></div>
    <div class="M-card">${budgets.map((b) => `<div class="M-row"><span class="ic" style="--hue:${exp(b.name).hue}">${ic(exp(b.name).icon)}</span><div class="main"><div class="t">${b.name}</div><div class="progress"><i style="width:${pct(b)}%;background:${b.spent > b.budget ? "var(--bad)" : exp(b.name).hue}"></i></div></div><div style="text-align:right;width:76px;flex:none">${amount(b.budget - b.spent, { paise: false })}<div class="muted" style="font-size:12px">${b.spent > b.budget ? "over" : "left"}</div></div></div>`).join("")}</div>
    ${byDay(txns).map(([d, ts], i) => `<div class="M-sec"><span>${d}</span>${i ? "" : `<a href="#">See all</a>`}</div><div class="M-card">${ts.map((t) => `<div class="M-row"><span class="ic round" style="--hue:${exp(t.to).hue}">${ic(exp(t.to).icon)}</span><div class="main"><div class="t">${txWho(t)}</div><div class="s">${t.to} · ${txSub(t)}</div></div>${txAmt(t)}</div>`).join("")}</div>`).join("")}
  </div>
  <nav class="M-tabs">
    <a href="#" class="on">${ic("house")}Home</a><a href="#">${ic("arrow-left-right")}Activity</a>
    <button class="plus" data-act="form" aria-label="New transaction"><span>${ic("plus")}</span></button>
    <a href="#">${ic("pie-chart")}Budgets</a><a href="#">${ic("menu")}More</a>
  </nav>`;

  const sheet = state.form ? `<div class="dialog-bg G-scrim" data-act="form"></div><section class="G-sheet" role="dialog" aria-label="New transaction"><div class="grab"></div>
    <div class="sh"><button data-act="form">Cancel</button><h3>New transaction</h3><button>Save</button></div>
    <div class="sb">
      <div class="amt"><span>₹</span><input value="2,386.75" inputmode="decimal" aria-label="Amount"></div>
      <div class="segc"><button class="on">Spent</button><button>Received</button><button>Moved</button></div>
      <div class="M-card">
        <div class="M-row"><label>From</label><select class="val"><option>HDFC Savings</option><option>HDFC Regalia</option><option>Cash</option></select>${ic("chevron-right")}</div>
        <div class="M-row"><label>To</label><select class="val"><option>Groceries</option><option>Eating out</option><option>Rent</option></select>${ic("chevron-right")}</div>
        <div class="M-row"><label>Date</label><input class="val" type="date" value="2026-10-16"></div>
      </div>
      <div class="M-sec"><span>Details</span></div>
      <div class="M-card">
        <div class="M-row"><label>Party</label><input class="val" value="BigBasket"></div>
        <div class="M-row"><label>Note</label><input class="val" placeholder="Optional"></div>
      </div>
    </div>
  </section>` : "";

  return desk + mob + dialog() + sheet;
}

// ---------- shell ----------
function sync() {
  const p = new URLSearchParams({ variant: state.variant });
  if (state.theme !== "system") p.set("theme", state.theme);
  if (state.privacy) p.set("privacy", "1");
  if (state.numfmt === "intl") p.set("numfmt", "intl");
  if (state.form) p.set("form", "1");
  history.replaceState(null, "", "?" + p);
}

const RENDER = { G: renderG, A: renderA, B: renderB, C: renderC, D: renderD, E: renderE, F: renderF };
function render() {
  const root = document.documentElement;
  if (state.theme === "system") delete root.dataset.theme; else root.dataset.theme = state.theme;
  document.body.dataset.variant = state.variant;
  document.getElementById("app").innerHTML = RENDER[state.variant]();
  window.lucide?.createIcons();
  const themes = { system: "Auto", light: "Light", dark: "Dark" };
  document.getElementById("proto").innerHTML = `
    <button data-p="prev" aria-label="Previous variant">‹</button>
    <select data-p="pick" aria-label="Variant">${Object.entries(VARIANTS).map(([k, n]) => `<option value="${k}" ${k === state.variant ? "selected" : ""}>${k}: ${n}</option>`).join("")}</select>
    <button data-p="next" aria-label="Next variant">›</button>
    <span class="sep"></span>
    <button data-p="theme">${themes[state.theme]}</button>
    <button data-p="privacy" class="${state.privacy ? "on" : ""}">Privacy</button>
    <button data-p="numfmt">${state.numfmt === "indian" ? "12,34,567" : "1,234,567"}</button>`;
  sync();
}

function go(variant) {
  state.variant = variant;
  state.form = false;
  render();
  scrollTo(0, 0);
}
function cycle(step) {
  const keys = Object.keys(VARIANTS);
  go(keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length]);
}

document.addEventListener("change", (e) => {
  if (e.target.dataset.p === "pick") { go(e.target.value); e.target.blur(); }
});
document.addEventListener("click", (e) => {
  const p = e.target.closest("button[data-p]")?.dataset.p;
  if (p === "prev") cycle(-1);
  if (p === "next") cycle(1);
  if (p === "theme") { state.theme = { system: "light", light: "dark", dark: "system" }[state.theme]; render(); }
  if (p === "privacy") { state.privacy = !state.privacy; render(); }
  if (p === "numfmt") { state.numfmt = state.numfmt === "indian" ? "intl" : "indian"; render(); }
  if (e.target.closest("[data-act=form]")) { state.form = !state.form; render(); }
  if (e.target.closest("a[href='#']")) e.preventDefault();
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  if (e.key === "Escape" && state.form) { state.form = false; render(); }
});
render();
</script>

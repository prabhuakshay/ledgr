<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers "How does entering a Transaction feel?" (issue #5), round 2.
  Round 1 picked C (From on one side, To on the other; only the side ADR 0003 allows can grow).
  Round 2 restyles C in ledgr's plain form language and covers editing an existing Transaction:
    C1  Columns: From and To columns; the shared Account sits once, each part sits on the other side with its amount.
    C2  Split rows: every row is a Split (From → To, amount); the shared cell repeats, locked, on later rows.
        On phones each Split is a row that opens its own screen.
  The pink strip switches variant and example (new or edit), theme, and shows what would be recorded.
  Click a row in the list behind the dialog to edit it. Resize below 760px for the phone sheet.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledgr transaction editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 6px; }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }

body {
  --bg: light-dark(#ffffff, #000000);
  --subtle: light-dark(#f6f8fa, #0d1117);
  --muted-bg: light-dark(#eff2f5, #151b23);
  --border: light-dark(#d1d9e0, #30363d);
  --border-muted: light-dark(#e3e8ed, #21262d);
  --fg: light-dark(#1f2328, #e6edf3);
  --muted: light-dark(#59636e, #9198a1);
  --faint: light-dark(#818b98, #656c76);
  --accent: light-dark(#0969da, #4493f8);
  --good: light-dark(#1a7f37, #3fb950);
  --bad: light-dark(#d1242f, #f85149);
  --attention: light-dark(#9a6700, #d29922);
  --primary: light-dark(#1f883d, #238636);
  --primary-hover: light-dark(#1c8139, #29903b);
  --btn: light-dark(#f6f8fa, #212830);
  --btn-hover: light-dark(#eff2f5, #262c36);
  --brand-ink: light-dark(#121418, #ece8df);
  --brand-green: light-dark(#13785a, #5fcb9f);
  --shadow: light-dark(0 1px 0 rgba(31,35,40,.04), none);
  --overlay-shadow: light-dark(0 8px 24px rgba(66,74,83,.2), 0 0 0 1px #30363d, 0 16px 32px rgba(0,0,0,.85));
  --page: light-dark(#f2f4f7, #000000);
  --card: light-dark(#ffffff, #0d1117);
  font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5;
  background: var(--bg); color: var(--fg);
  -webkit-font-smoothing: antialiased;
}
.logo { height: 24px; width: auto; display: block; color: var(--brand-ink); flex: none; }
.muted { color: var(--muted); }
.num { white-space: nowrap; flex: none; }
.num .dec { color: var(--muted); }
.box { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.box-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--subtle); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; }
.box-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.box-r { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border-muted); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.box-h + .box-r { border-top: 0; }
.box-r .main { flex: 1; }
.box-r .s { color: var(--muted); font-size: 12px; }
button.box-r:hover { background: var(--subtle); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--btn); color: var(--fg); font-weight: 500; white-space: nowrap; box-shadow: var(--shadow); flex: none; }
.btn:hover { background: var(--btn-hover); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.primary { background: var(--primary); border-color: rgba(31,35,40,.15); color: #fff; }
.btn.primary:hover:not([disabled]) { background: var(--primary-hover); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: transparent; }
.btn.split { border-radius: 6px 0 0 6px; }
.btn.split + .btn { border-radius: 0 6px 6px 0; border-left-color: rgba(255,255,255,.25); padding: 0 6px; }
.link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; font-weight: 500; }
.link:hover { text-decoration: underline; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--btn-hover); color: var(--fg); }
.iconbtn.sm { width: 28px; height: 28px; }
.input { width: 100%; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
.input:focus, .pick:focus-visible { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.input.err, .pick.err { border-color: var(--bad); }
.amt { text-align: right; font-weight: 500; }
kbd { font-family: inherit; font-size: 11px; line-height: 18px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--bg); }
.label { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 4px 0 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 500; white-space: nowrap; }
.label button { border: 0; background: none; padding: 0; color: var(--muted); display: grid; }
.label button svg { width: 12px; height: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hue, var(--muted)); flex: none; }
.fl { display: block; font-weight: 600; margin-bottom: 6px; }
.fl .muted { font-weight: 400; }
.err-t { color: var(--bad); font-size: 12px; margin-top: 4px; }
.hint { color: var(--muted); font-size: 12px; }

/* ---------- background page ---------- */
.hdr { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: var(--subtle); border-bottom: 1px solid var(--border); }
.hdr .crumb { font-weight: 600; display: flex; gap: 8px; }
.hdr .sp { flex: 1; }
.hdr .fake-search { width: 280px; height: 32px; border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); background: var(--bg); }
.hdr .fake-search kbd { margin-left: auto; }
.rel { position: relative; display: flex; flex-direction: column; }
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; max-width: 1200px; margin: 0 auto; padding: 24px; }
.side h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 8px 4px; }
.side h4:first-child { margin-top: 0; }
.side a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); position: relative; }
.side a.on { background: var(--muted-bg); font-weight: 600; }
.side a.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px; border-radius: 6px; background: var(--accent); }
.side a svg { color: var(--muted); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border-muted); }
.ph h1 { margin: 0; font-size: 24px; font-weight: 400; }
.txr .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--subtle); border: 1px solid var(--border); color: var(--muted); flex: none; }
.txr.new { background: color-mix(in srgb, var(--good) 8%, transparent); }
@media (max-width: 1000px) { .shell { grid-template-columns: 1fr; } .side { display: none; } }

.mob, .mtabs { display: none; }
@media (max-width: 760px) {
  body { background: var(--page); padding-bottom: 80px; }
  .desk { display: none; }
  .mob { display: block; }
  .mtabs { display: grid; }
}
.mbar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; }
.mtitle { padding: 2px 20px 14px; }
.mtitle h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.mcard { margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid light-dark(transparent, var(--border-muted)); overflow: hidden; }
.mrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; position: relative; width: 100%; border: 0; background: none; text-align: left; }
.mrow + .mrow::before { content: ""; position: absolute; top: 0; right: 0; left: 60px; border-top: 1px solid var(--border-muted); }
.mrow .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: #59636e; flex: none; }
.mrow .main { flex: 1; }
.mrow .t { font-size: 15px; font-weight: 500; }
.mrow .s { color: var(--muted); font-size: 13px; }
.mtabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); }
.mtabs a, .mtabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; font-size: 11px; font-weight: 500; color: var(--muted); border: 0; background: none; }
.mtabs a.on { color: var(--fg); font-weight: 600; }
.mtabs a svg { width: 22px; height: 22px; }
.mtabs .plus span { width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; margin-top: -18px; }
.mtabs .plus svg { width: 24px; height: 24px; }

/* ---------- dialog ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: light-dark(rgba(31,35,40,.5), rgba(1,4,9,.8)); }
.dlg { position: fixed; z-index: 61; top: 96px; left: 50%; transform: translateX(-50%); width: min(var(--w, 720px), calc(100% - 32px)); max-height: calc(100vh - 120px); display: flex; flex-direction: column; background: var(--bg); border-radius: 12px; box-shadow: var(--overlay-shadow); }
.dh { display: flex; align-items: center; gap: 4px; padding: 12px 8px 12px 16px; border-bottom: 1px solid var(--border-muted); }
.dh .t { flex: 1; }
.dh h2 { margin: 0; font-size: 14px; font-weight: 600; }
.db { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.df { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border-muted); }
.df .tot { flex: 1; display: flex; align-items: baseline; gap: 8px; }
.df .tot .num { font-size: 16px; font-weight: 600; }
.df .keys { font-size: 12px; color: var(--muted); margin-right: 8px; }
.df.confirm { background: color-mix(in srgb, var(--bad) 6%, transparent); border-radius: 0 0 12px 12px; }
.df.confirm .msg { flex: 1; }
.top { display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--attention) 40%, transparent); background: color-mix(in srgb, var(--attention) 8%, transparent); font-size: 13px; }
.note svg { color: var(--attention); margin-top: 2px; }
.files { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.file { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
.file svg { color: var(--muted); }
.file button { border: 0; background: none; color: var(--muted); display: grid; padding: 2px; }
.file button svg { width: 14px; height: 14px; }
.hist summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.hist summary::-webkit-details-marker { display: none; }
.hist[open] summary svg { transform: rotate(90deg); }
.hist ol { margin: 8px 0 0; padding: 0 0 0 16px; border-left: 2px solid var(--border-muted); list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.hist li .when { color: var(--muted); margin-left: 6px; }

/* ---------- pickers ---------- */
.pick { width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); text-align: left; }
.pick .ph-t { color: var(--muted); flex: 1; }
.pick .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick > svg:last-child { color: var(--muted); }
.pop { position: absolute; z-index: 70; left: 0; top: calc(100% + 4px); width: max(100%, 300px); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--overlay-shadow); overflow: hidden; }
.pop.right { left: auto; right: 0; }
.pop .pi { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border-muted); color: var(--muted); }
.pop .pi input { flex: 1; height: 40px; border: 0; background: none; color: var(--fg); }
.pop .pi input:focus { outline: none; }
.pop .pl { max-height: 300px; overflow-y: auto; padding: 6px; }
.pop h5 { margin: 6px 8px 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
.pop .opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: none; text-align: left; }
.pop .opt.hi { background: var(--muted-bg); }
.pop .opt .s { margin-left: auto; color: var(--muted); font-size: 12px; }
.pop .opt.create { color: var(--accent); }
.pop .opt .chk { width: 16px; color: var(--accent); }
.pop .pf { padding: 6px 12px; border-top: 1px solid var(--border-muted); font-size: 12px; color: var(--muted); }
.ptop { display: none; }
@media (max-width: 760px) {
  .pop { position: fixed; left: 0; right: 0; bottom: 0; top: 96px; width: auto; border-radius: 14px 14px 0 0; border: 0; display: flex; flex-direction: column; background: var(--page); }
  .pop .pi { margin: 12px 16px 4px; border: 0; border-radius: 10px; background: var(--muted-bg); }
  .pop .pi input { font-size: 16px; }
  .pop .pl { max-height: none; flex: 1; padding: 0 16px 24px; }
  .pop h5 { margin: 16px 4px 6px; font-size: 13px; }
  .pop .opt { min-height: 48px; font-size: 16px; background: var(--card); border-radius: 0; border-top: 1px solid var(--border-muted); }
  .pop .opt.hi { background: var(--card); }
  .pop .pf { display: none; }
  .ptop { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 0; font-weight: 600; font-size: 17px; }
  .ptop button { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 0; }
}

/* ---------- C1: columns ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); column-gap: 8px; row-gap: 8px; align-items: start; }
.cols .arrow { height: 32px; display: grid; place-items: center; color: var(--faint); }
.part { display: grid; grid-template-columns: minmax(0, 1fr) 112px auto; gap: 6px; align-items: start; }
.part .acts { display: flex; height: 32px; align-items: center; }
.part .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.part .tags:empty { display: none; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.shared { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 6px; }
.adds { display: flex; gap: 16px; min-height: 20px; }

/* ---------- C2: split rows ---------- */
.srows { display: grid; grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr) 112px 60px; column-gap: 8px; row-gap: 8px; align-items: center; }
.srows .h { font-weight: 600; }
.srows .h.r { text-align: right; }
.srows .arrow { display: grid; place-items: center; color: var(--faint); }
.srows .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin: -2px 0 2px; }
.srows .tags:empty { display: none; }
.srows .acts { display: flex; }
.locked { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px dashed var(--border); border-radius: 6px; color: var(--muted); background: none; text-align: left; width: 100%; }
.locked .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.locked > svg:last-child { color: var(--faint); }

/* ---------- phone sheet ---------- */
.sheet { position: fixed; z-index: 61; left: 0; right: 0; bottom: 0; top: 88px; display: flex; flex-direction: column; background: var(--page); border-radius: 14px 14px 0 0; box-shadow: var(--overlay-shadow); }
.sh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 52px; padding: 0 16px; }
.sh h2 { margin: 0; font-size: 17px; font-weight: 600; }
.sh button { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 0; display: flex; align-items: center; }
.sh button[disabled] { color: var(--faint); }
.sh > :last-child { justify-self: end; font-weight: 600; }
.sh > :first-child { justify-self: start; }
.sb { flex: 1; overflow-y: auto; padding: 0 0 32px; }
.ssec { padding: 20px 20px 6px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
.sfoot { padding: 6px 20px 0; font-size: 13px; color: var(--muted); }
.icard { margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid light-dark(transparent, var(--border-muted)); overflow: hidden; }
.irow { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 16px; position: relative; width: 100%; border: 0; background: none; text-align: left; font-size: 16px; color: var(--fg); }
.icard > * + *::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: 1px solid var(--border-muted); }
.icard > .rel + .rel::before, .icard > .rel + *::before { display: none; }
.icard > * + .rel > .irow::before, .icard > .rel + .irow::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: 1px solid var(--border-muted); display: block; }
.irow .k { flex: none; min-width: 72px; }
.irow .v { flex: 1; text-align: right; color: var(--muted); display: flex; justify-content: flex-end; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; }
.irow .v.set { color: var(--fg); }
.irow input { flex: 1; border: 0; background: none; text-align: right; font-size: 16px; padding: 0; height: 32px; }
.irow input:focus { outline: none; }
.irow.err .k, .irow.err .main .t { color: var(--bad); }
.irow > svg:last-child { color: var(--muted); opacity: .6; }
.irow.act { color: var(--accent); }
.irow.bad { color: var(--bad); justify-content: center; }
.irow .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.irow .main .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.irow .main .s { color: var(--muted); font-size: 13px; }
.irow .amtin { width: 110px; flex: none; font-weight: 500; }
.irow > .rel { flex: 1; }
.irow .lk { color: var(--faint); display: grid; }
.snote { margin: 12px 16px 0; }
.mfiles { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; }

/* ---------- state panel and toast ---------- */
.state { position: fixed; z-index: 90; right: 12px; bottom: 12px; width: 340px; max-height: 50vh; overflow: auto; background: #1f2328; color: #e6edf3; border-radius: 8px; padding: 10px 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; box-shadow: 0 8px 24px rgba(0,0,0,.4); margin: 0; white-space: pre-wrap; }
.state b { color: #ff7bb0; font-weight: 600; }
.state .bad { color: #ff8182; }
.state .ok { color: #7ee787; }
.toast { position: fixed; z-index: 80; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--fg); color: var(--bg); font-weight: 500; box-shadow: var(--overlay-shadow); white-space: nowrap; }
@media (max-width: 760px) { .toast { bottom: 96px; } .state { left: 12px; right: 12px; width: auto; bottom: 88px; } }

/* ---------- prototype strip (not part of any design) ---------- */
body { padding-top: 40px; }
.proto { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 40px; display: flex; align-items: center; justify-content: safe center; gap: 6px; padding: 0 8px; background: #ff3d8b; color: #fff; font: 600 13px/1 system-ui, sans-serif; white-space: nowrap; overflow-x: auto; }
.proto button, .proto select { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 6px; height: 28px; padding: 0 10px; font: inherit; flex: none; }
.proto select option { color: #000; }
.proto .sep { width: 1px; height: 20px; background: rgba(255,255,255,.4); margin: 0 4px; flex: none; }
</style>
</head>
<body>
<div class="proto" id="proto"></div>
<div id="app"></div>
<script>

const RECENT_ACC = ["hdfc", "regalia", "groceries", "dining", "cash", "household", "sbi", "fuel"];
const PARTIES = {

  bigbasket: { n: "BigBasket", last: { shared: "from", anchor: "hdfc", lines: ["groceries", "household"] } },
  acme: { n: "Acme Technologies", last: { shared: "from", anchor: "salary", lines: ["hdfc", "epf"] } },
  natures: { n: "Nature's Basket", last: { shared: "from", anchor: "regalia", lines: ["groceries"] } },
  kulkarni: { n: "Mr Kulkarni (landlord)", last: { shared: "from", anchor: "hdfc", lines: ["rent"] } },

// Each example is the editor's whole state. An `edit` block makes it an existing Transaction.
const today = "2026-10-16";
const SCENARIOS = {
  blank: { t: "New: blank", tx: { party: null, shared: "from", anchor: null, lines: [{ acct: null, amt: "" }] } },
  salary: { t: "New: salary with deductions", tx: { party: "acme", shared: "from", anchor: "salary", lines: [{ acct: "hdfc", amt: "85000" }, { acct: "epf", amt: "3600" }], files: ["payslip-oct.pdf"] } },
  cardbill: { t: "New: card bill from two banks", tx: { party: null, shared: "to", anchor: "regalia", lines: [{ acct: "hdfc", amt: "30000" }, { acct: "sbi", amt: "12816" }] } },
  egroceries: { t: "Edit: BigBasket (reconciled)", tx: { date: "2026-09-28", party: "bigbasket", shared: "from", anchor: "hdfc", lines: [{ acct: "groceries", amt: "1840" }, { acct: "household", amt: "420", tags: ["reimb"] }], files: ["invoice-4471.pdf"] },
    edit: { added: "28 Sep", via: "from Quick Add", history: [["Created from Quick Add “bigbasket 2260 hdfc”", "28 Sep, 9:14 pm"], ["Household changed from ₹380.00 to ₹420.00", "2 Oct, 8:02 am"], ["Tag Reimbursable added to Household", "2 Oct, 8:02 am"]] } },
  erefund: { t: "Edit: refund", tx: { date: "2026-10-10", party: "natures", shared: "from", anchor: "groceries", lines: [{ acct: "amazon", amt: "300" }] },
    edit: { added: "10 Oct", via: "by hand", history: [["Created", "10 Oct, 6:40 pm"]] } },
  elunch: { t: "Edit: lunch", tx: { date: "2026-10-15", party: "toit", shared: "from", anchor: "regalia", lines: [{ acct: "dining", amt: "850", tags: ["goa"] }], files: ["receipt.jpg"] },
    edit: { added: "15 Oct", via: "by hand", history: [["Created", "15 Oct, 2:12 pm"]] } },
};

const params = new URLSearchParams(location.search);
const state = {
  variant: VARIANTS[params.get("variant")] ? params.get("variant") : "C1",
  scenario: SCENARIOS[params.get("ex")] ? params.get("ex") : "blank",
  theme: params.get("theme") || "system",
  open: true,
  showState: false,
  tx: null,
  edit: null,
  snapshot: "",
  picker: null, // { target, q, hi }
  confirm: null, // "delete" | "discard"
  mSplit: null, // phone, C2: index of the Split whose screen is open
  tried: false,
  toast: null,
  saved: [],
  deleted: [],
};
function load(key) {
  const sc = SCENARIOS[key], s = structuredClone(sc.tx);
  state.tx = { date: today, note: "", files: [], ...s, lines: s.lines.map((l) => ({ tags: [], ...l })) };
  state.edit = sc.edit ? { ...sc.edit, key } : null;
  state.snapshot = JSON.stringify(state.tx);
  state.picker = state.confirm = state.mSplit = null;
  state.tried = false;
}
const dirty = () => JSON.stringify(state.tx) !== state.snapshot;

// ---------- money ----------
const fmtN = (n) => new Intl.NumberFormat("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
function parse(s) {
  s = String(s ?? "").replace(/[₹,\s]/g, "");
  if (!s) return 0;
  if (!/^[\d.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function(`"use strict";return (${s})`)(); return Number.isFinite(v) ? Math.round(v * 100) / 100 : NaN; } catch { return NaN; }
}
function money(n) {
  const [i, d] = Math.abs(n).toFixed(2).split(".");
  return `<span class="num">₹${fmtN(Number(i))}<span class="dec">.${d}</span></span>`;
}
// Amounts show grouped (85,000) except in the field being typed in.
let focusKey = null;
function pretty(s, k) {
  if (!s || k === focusKey || /[+\-*/]/.test(s)) return s;
  const n = parse(s);
  return Number.isNaN(n) ? s : fmtN(n);
}
const sumLines = () => state.tx.lines.reduce((a, l) => a + (parse(l.amt) || 0), 0);

// ---------- the Transaction's shape (ADR 0003) ----------
// One side is shared by every Split ("anchor"); the other side has one Account per Split ("lines").
const tx = () => state.tx;
const many = () => tx().lines.length > 1;
const fromIds = () => (tx().shared === "from" ? [tx().anchor] : tx().lines.map((l) => l.acct)).filter(Boolean);
const toIds = () => (tx().shared === "to" ? [tx().anchor] : tx().lines.map((l) => l.acct)).filter(Boolean);
const kindsOf = (ids) => new Set(ids.map((id) => ACC[id].k));
function kindOf() {
  const f = kindsOf(fromIds()), t = kindsOf(toIds());
  if (f.has("income")) return "received";
  if (f.has("expense")) return "refund";
  if (t.has("expense")) return "spent";
  if (f.size && t.size) return "transfer";
  return null;
}
function allowedKinds(side) {
  const other = kindsOf(side === "from" ? toIds() : fromIds());
  return ["asset", "liability", "income", "expense"].filter((k) => {
    if (side === "to" && k === "income") return false;
    if (k === "expense" && (other.has("expense") || other.has("income"))) return false;
    if (side === "from" && k === "income" && other.has("expense")) return false;
    return true;
  });
}
const sideOf = (target) => (target === "anchor" ? tx().shared : tx().shared === "from" ? "to" : "from");
const acctOf = (target) => (target === "anchor" ? tx().anchor : tx().lines[+target.split(":")[1]].acct);
function setAcct(target, id) {
  if (target === "anchor") tx().anchor = id;
  else tx().lines[+target.split(":")[1]].acct = id;
}
function addLine() { tx().lines.push({ acct: null, amt: "", tags: [] }); }
// Let the other side become the many: the single line's Account becomes the anchor, the old anchor a line.
function flip() {
  const t = tx(), only = t.lines[0];
  t.lines = [{ acct: t.anchor, amt: only.amt, tags: only.tags }];
  t.anchor = only.acct;
  t.shared = t.shared === "from" ? "to" : "from";
}
// Adding on a side grows the lines if that side already holds them, otherwise flips first.
function addOn(side) {
  const linesSide = tx().shared === "from" ? "to" : "from";
  if (side !== linesSide) flip();
  addLine();
}
function errors() {
  const t = tx(), e = {};
  if (!t.date) e.date = "Pick a date";
  else if (t.date > today) e.date = "A Transaction can't be dated after today";
  if (!t.anchor) e.anchor = "Pick an Account";
  t.lines.forEach((l, i) => {
    if (!l.acct) e["line:" + i] = "Pick an Account";
    const v = parse(l.amt);
    if (!(v > 0)) e["amt:" + i] = Number.isNaN(v) ? "Not a number" : "Enter an amount";
  });
  return e;
}
const err = (k) => (state.tried ? errors()[k] : null);
// A Reconciliation an edit could put off: one of this Transaction's Accounts is reconciled through a day on or after its date.
function reconciledHit() {
  if (!state.edit) return null;
  const snap = JSON.parse(state.snapshot);
  const ids = [snap.anchor, ...snap.lines.map((l) => l.acct)];
  const id = ids.find((a) => RECONCILED[a] && snap.date <= RECONCILED[a]);
  return id ? { id, through: RECONCILED[id] } : null;
}

// ---------- small pieces ----------
const ic = (n) => `<i data-lucide="${n}"></i>`;
const phone = () => innerWidth <= 760;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
function acctMark(id) {
  const a = ACC[id];
  return a.k === "expense" ? `<span class="dot" style="--hue:${a.hue}"></span>` : ic(a.i);
}
const acctName = (id) => (id ? ACC[id].n : "");
const tagLabel = (k, i) => `<span class="label">${TAGS[k]}<button data-untag="${i}:${k}" aria-label="Remove ${TAGS[k]}">${ic("x")}</button></span>`;
const sideWord = (side) => (side === "from" ? "From" : "To");

function pickBtn(target, opts = {}) {
  const isParty = target === "party";
  const id = isParty ? tx().party : target.startsWith("tags") ? null : acctOf(target);
  const val = isParty ? (id ? `${ic("user")}<span class="val">${PARTIES[id].n}</span>` : "") : id ? `${acctMark(id)}<span class="val">${ACC[id].n}</span>` : "";
  const ph = opts.ph || (isParty ? "None" : "Pick an Account");
  const btn = opts.custom || `<button type="button" class="pick ${err(target) ? "err" : ""}" data-pick="${target}" data-flow ${opts.label ? `aria-label="${opts.label}"` : ""}>${val || `<span class="ph-t">${ph}</span>`}${ic("chevron-down")}</button>`;
  return `<div class="rel">${btn}${state.picker?.target === target ? picker(opts.right) : ""}${err(target) && !opts.noErr ? `<div class="err-t">${err(target)}</div>` : ""}</div>`;
}
function lastHint(id) {
  const l = PARTIES[id].last;
  return l ? `${ACC[l.anchor].n} → ${l.lines.map((x) => ACC[x].n).join(", ")}` : "";
}
function pickerOptions() {
  const p = state.picker, q = p.q.trim().toLowerCase(), m = (s) => s.toLowerCase().includes(q);
  const out = [];
  if (p.target === "party") {
    const rec = q ? [] : RECENT_PARTY;
    const row = (id) => ({ id, label: PARTIES[id].n, icon: ic("user"), s: lastHint(id) });
    if (rec.length) out.push({ h: "Recent" }, ...rec.map(row));
    const rest = Object.keys(PARTIES).filter((id) => (q ? m(PARTIES[id].n) : !rec.includes(id)));
    if (rest.length) out.push({ h: q ? "Parties" : "All Parties" }, ...rest.map(row));
    if (q && !Object.values(PARTIES).some((x) => x.n.toLowerCase() === q)) out.push({ create: "party", label: `Create Party “${esc(p.q.trim())}”`, icon: ic("plus") });
    if (tx().party) out.push({ h: "" }, { id: null, label: "No Party", icon: ic("x") });
    return out;
  }
  if (p.target.startsWith("tags")) {
    const on = tx().lines[+p.target.split(":")[1]].tags;
    out.push(...Object.keys(TAGS).filter((k) => m(TAGS[k])).map((k) => ({ tag: k, label: TAGS[k], icon: `<span class="chk">${on.includes(k) ? ic("check") : ""}</span>` })));
    if (q && !Object.values(TAGS).some((x) => x.toLowerCase() === q)) out.push({ create: "tag", label: `Create Tag “${esc(p.q.trim())}”`, icon: ic("plus") });
    return out;
  }
  const kinds = allowedKinds(sideOf(p.target));
  const own = acctOf(p.target);
  const taken = new Set([tx().anchor, ...tx().lines.map((l) => l.acct)].filter((a) => a && a !== own));
  const ok = (id) => kinds.includes(ACC[id].k) && !taken.has(id);
  const row = (id) => ({ id, label: ACC[id].n, icon: acctMark(id), s: id === own ? "Current" : KIND_T[ACC[id].k] });
  if (!q) {
    const rec = RECENT_ACC.filter(ok).slice(0, 5);
    if (rec.length) out.push({ h: "Recent" }, ...rec.map(row));
  }
  for (const k of kinds) {
    const ids = Object.keys(ACC).filter((id) => ACC[id].k === k && ok(id) && (!q || m(ACC[id].n)));
    if (ids.length) out.push({ h: KIND_T[k] + " Accounts" }, ...ids.map(row));
  }
  if (q && !Object.values(ACC).some((a) => a.n.toLowerCase() === q)) {
    for (const k of kinds) out.push({ create: k, label: `Create ${KIND_T[k]} Account “${esc(p.q.trim())}”`, icon: ic("plus") });
  }
  return out;
}
function picker(right) {
  const p = state.picker, opts = pickerOptions();
  let n = -1;
  const isAcct = p.target !== "party" && !p.target.startsWith("tags");
  const title = p.target === "party" ? "Party" : p.target.startsWith("tags") ? "Tags" : sideWord(sideOf(p.target));
  const foot = isAcct ? (p.target === "anchor" && many() ? `Changes the ${title} Account of every Split` : "Accounts that can't go here are hidden") : p.target.startsWith("tags") ? "Enter toggles a Tag. Esc closes." : "Picking a Party fills in the Accounts you used last time.";
  return `<div class="pop ${right ? "right" : ""}" role="dialog" aria-label="${title}">
    <div class="ptop"><span>${title}</span><button data-closepick>Done</button></div>
    <div class="pi">${ic("search")}<input data-k="pq" value="${esc(p.q)}" placeholder="Search or create" autocomplete="off"></div>
    <div class="pl" role="listbox">${opts.map((o) => {
      if (o.h !== undefined) return o.h ? `<h5>${o.h}</h5>` : "";
      n++;
      const attrs = o.create ? `data-create="${o.create}"` : o.tag ? `data-tag="${o.tag}"` : `data-choose="${o.id ?? ""}"`;
      return `<button type="button" class="opt ${o.create ? "create" : ""} ${n === p.hi ? "hi" : ""}" ${attrs}>${o.icon}<span>${o.label}</span>${o.s ? `<span class="s">${o.s}</span>` : ""}</button>`;
    }).join("") || `<div class="hint" style="padding:8px">Nothing matches</div>`}</div>
    <div class="pf">${foot}</div></div>`;
}

const tagBtn = (i) => pickBtn("tags:" + i, { right: true, custom: `<button type="button" class="iconbtn sm" data-pick="tags:${i}" aria-label="Tags" title="Tags">${ic("tag")}</button>` });
const tagList = (i) => tx().lines[i].tags.map((k) => tagLabel(k, i)).join("");
const removeBtn = (i) => (many() ? `<button type="button" class="iconbtn sm" data-rm="${i}" aria-label="Remove this Split" title="Remove">${ic("x")}</button>` : "");
function amtInput(i) {
  return `<div><input class="input amt ${err("amt:" + i) ? "err" : ""}" data-k="amt:${i}" data-flow inputmode="decimal" placeholder="0.00" value="${esc(pretty(tx().lines[i].amt, "amt:" + i))}" aria-label="Amount">${err("amt:" + i) ? `<div class="err-t">${err("amt:" + i)}</div>` : ""}</div>`;
}
function filesBlock() {
  const f = tx().files.map((n, i) => `<span class="file">${ic(n.endsWith(".pdf") ? "file-text" : "image")}${n}<button data-unfile="${i}" aria-label="Remove ${n}">${ic("x")}</button></span>`).join("");
  return `<div><label class="fl">Attachments</label><div class="files">${f}<button type="button" class="link" data-act="attach">${ic("paperclip")}Attach a file</button><span class="hint">or drop one on this window</span></div></div>`;
}
function topFields() {
  const t = tx();
  return `<div class="top"><div><label class="fl">Date</label><input type="date" class="input ${err("date") ? "err" : ""}" data-k="date" data-flow value="${t.date}" max="${today}">${err("date") ? `<div class="err-t">${err("date")}</div>` : ""}</div>
    <div><label class="fl">Party <span class="muted">optional</span></label>${pickBtn("party")}</div></div>
    <div><label class="fl">Note <span class="muted">optional</span></label><input class="input" data-k="note" data-flow value="${esc(t.note)}" placeholder="What it was for"></div>`;
}
function reconciledNote() {
  const r = reconciledHit();
  if (!r) return "";
  return `<div class="note">${ic("check-check")}<div>${ACC[r.id].n} is reconciled through ${fmtDate(r.through)}. Changing this Transaction's date, amounts or Accounts puts that Reconciliation off until the difference is fixed.</div></div>`;
}
function historyBlock() {
  if (!state.edit) return "";
  const h = state.edit.history;
  return `<details class="hist"><summary>${ic("chevron-right")}History, ${h.length} ${h.length === 1 ? "entry" : "entries"}</summary><ol>${h.map(([w, at]) => `<li>${w}<span class="when">${at}</span></li>`).join("")}</ol></details>`;
}
function headerD() {
  const e = state.edit;
  const actions = e ? `<button class="iconbtn" data-act="schedule" title="Make a Schedule from this" aria-label="Make a Schedule from this">${ic("repeat")}</button><button class="iconbtn" data-act="delete" title="Delete" aria-label="Delete">${ic("trash-2")}</button>` : "";
  return `<div class="dh"><div class="t"><h2>${e ? "Edit transaction" : "New transaction"}</h2>${e ? `<div class="hint">Added ${e.added}, ${e.via}</div>` : ""}</div>${actions}<button class="iconbtn" data-close aria-label="Close">${ic("x")}</button></div>`;
}
function footerD() {
  if (state.confirm === "delete") {
    const nf = tx().files.length;
    return `<div class="df confirm"><span class="msg">Delete this Transaction${nf ? ` and its ${nf === 1 ? "Attachment" : nf + " Attachments"}` : ""}? This can't be undone.</span><button class="btn" data-cancelconfirm>Keep it</button><button class="btn danger solid" data-dodelete>Delete</button></div>`;
  }
  if (state.confirm === "discard") return `<div class="df confirm"><span class="msg">Discard your changes?</span><button class="btn" data-cancelconfirm>Keep editing</button><button class="btn danger solid" data-dodiscard>Discard</button></div>`;
  const n = tx().lines.length;
  const can = !state.edit || dirty();
  return `<div class="df"><div class="tot"><span class="muted">Total</span>${money(sumLines())}${n > 1 ? `<span class="muted">in ${n} Splits</span>` : ""}</div>
    <span class="keys"><kbd>Ctrl</kbd> <kbd>Enter</kbd></span>
    <button class="btn" data-close>Cancel</button><button class="btn primary" data-save ${can ? "" : "disabled"}>${state.edit ? "Save changes" : "Save"}</button></div>`;
}
function dialog(inner, w) {
  return `<div class="dlg" style="--w:${w}px" role="dialog" aria-label="${state.edit ? "Edit" : "New"} transaction">${headerD()}<div class="db">${reconciledNote()}${inner}</div>${footerD()}</div>`;
}

// ---------- C1: columns ----------
// The shared Account sits once on its side; the other side lists one part per Split, each with its amount.
function c1() {
  if (phone()) return c1Phone();
  const t = tx(), linesSide = t.shared === "from" ? "to" : "from";
  const anchor = `<div>${pickBtn("anchor", { label: sideWord(t.shared) })}${many() ? `<div class="shared">${ic("link-2")}Shared by all ${t.lines.length} Splits</div>` : ""}</div>`;
  const parts = `<div class="stack">${t.lines.map((l, i) => `<div class="part">${pickBtn("line:" + i, { label: sideWord(linesSide) })}${amtInput(i)}<div class="acts">${tagBtn(i)}${removeBtn(i)}</div><div class="tags">${tagList(i)}</div></div>`).join("")}</div>`;
  const add = (side) => (many() && side === t.shared ? "" : `<button type="button" class="link" data-addon="${side}">${ic("plus")}Add ${side === "from" ? "a source" : "a destination"}</button>`);
  const body = `${topFields()}
    <div class="cols" style="grid-template-columns:${t.shared === "from" ? "minmax(0, 1fr) 24px minmax(0, 1.5fr)" : "minmax(0, 1.5fr) 24px minmax(0, 1fr)"}">
      <span class="fl" style="margin:0">From</span><span></span><span class="fl" style="margin:0">To</span>
      ${t.shared === "from" ? anchor : parts}<span class="arrow">${ic("arrow-right")}</span>${t.shared === "from" ? parts : anchor}
      <div class="adds">${add("from")}</div><span></span><div class="adds">${add("to")}</div>
    </div>
    ${filesBlock()}${historyBlock()}`;
  return dialog(body, 720);
}
function c1Phone() {
  const t = tx(), linesSide = t.shared === "from" ? "to" : "from";
  const anchorCard = `<div class="icard">${acctRow("anchor")}</div>${many() ? `<div class="sfoot">Shared by all ${t.lines.length} Splits.</div>` : ""}`;
  const partRow = (i) => {
    const l = t.lines[i];
    return `<div class="irow ${err("line:" + i) || err("amt:" + i) ? "err" : ""}">${pickBtn("line:" + i, { noErr: true, custom: `<button type="button" class="main" data-pick="line:${i}" style="border:0;background:none;padding:0;text-align:left;font-size:16px"><span class="t">${l.acct ? acctMark(l.acct) + ACC[l.acct].n : `<span class="muted">Pick an Account</span>`}</span></button>` })}<span class="muted">₹</span><input class="amtin" data-k="amt:${i}" inputmode="decimal" placeholder="0" value="${esc(pretty(l.amt, "amt:" + i))}" aria-label="Amount"></div>
      <div class="irow" style="min-height:40px;font-size:14px;padding-top:0">${tagList(i) ? `<span style="display:flex;gap:4px;flex-wrap:wrap;flex:1">${tagList(i)}</span>` : `<span style="flex:1"></span>`}${pickBtn("tags:" + i, { custom: `<button type="button" class="link" data-pick="tags:${i}">${ic("tag")}Tag</button>` })}${many() ? `<button class="link" data-rm="${i}" style="color:var(--bad);margin-left:16px">Remove</button>` : ""}</div>`;
  };
  const partsCard = `<div class="icard">${t.lines.map((_, i) => partRow(i)).join("")}<button class="irow act" data-addon="${linesSide}">${ic("plus")}Add ${linesSide === "from" ? "a source" : "a destination"}</button></div>`;
  const addAnchorSide = !many() ? `<div class="icard" style="margin-top:8px"><button class="irow act" data-addon="${t.shared}" style="font-size:15px">${ic("plus")}Add ${t.shared === "from" ? "a source" : "a destination"}</button></div>` : "";
  const sec = (side) => `<div class="ssec"><span>${sideWord(side)}</span>${side === linesSide && many() ? `<span>${money(sumLines())}</span>` : ""}</div>${side === t.shared ? anchorCard + addAnchorSide : partsCard}`;
  return sheet(`${phoneTop()}${sec("from")}${sec("to")}${phoneBottom()}`);
}
function acctRow(target) {
  const id = acctOf(target);
  return pickBtn(target, { noErr: true, custom: `<button type="button" class="irow ${err(target) ? "err" : ""}" data-pick="${target}"><span class="main"><span class="t">${id ? acctMark(id) + ACC[id].n : `<span class="muted">Pick an Account</span>`}</span></span>${ic("chevron-right")}</button>` });
}
function phoneTop() {
  const t = tx(), r = reconciledHit();
  return `${r ? `<div class="snote note">${ic("check-check")}<div>${ACC[r.id].n} is reconciled through ${fmtDate(r.through)}. Changing the date, amounts or Accounts puts it off.</div></div>` : ""}
    <div class="ssec"><span>Details</span></div><div class="icard"><label class="irow ${err("date") ? "err" : ""}"><span class="k">Date</span><input type="date" data-k="date" value="${t.date}" max="${today}"></label>${pickBtn("party", { custom: `<button type="button" class="irow" data-pick="party"><span class="k">Party</span><span class="v ${t.party ? "set" : ""}">${t.party ? PARTIES[t.party].n : "None"}</span>${ic("chevron-right")}</button>` })}<label class="irow"><span class="k">Note</span><input data-k="note" value="${esc(t.note)}" placeholder="Optional"></label></div>`;
}
function phoneBottom() {
  const t = tx();
  const files = t.files.length ? `<div class="mfiles">${t.files.map((n, i) => `<span class="file">${ic(n.endsWith(".pdf") ? "file-text" : "image")}${n}<button data-unfile="${i}" aria-label="Remove ${n}">${ic("x")}</button></span>`).join("")}</div>` : "";
  const hist = state.edit ? `<div class="ssec"><span>History</span></div><div class="icard">${state.edit.history.map(([w, at]) => `<div class="irow" style="font-size:14px"><span class="main"><span class="t" style="white-space:normal">${w}</span><span class="s">${at}</span></span></div>`).join("")}</div>` : "";
  const edit = state.edit ? `<div class="icard" style="margin-top:24px"><button class="irow act" data-act="schedule">${ic("repeat")}Make a Schedule from this</button><button class="irow bad" data-act="delete">Delete Transaction</button></div>` : "";
  return `<div class="ssec"><span>Attachments</span></div><div class="icard">${files}<button class="irow act" data-act="attach">${ic("camera")}Take a photo</button><button class="irow act" data-act="attach">${ic("paperclip")}Choose a file</button></div>${hist}${edit}`;
}
function sheet(body, opts = {}) {
  const can = !state.edit || dirty();
  const head = opts.head || `<div class="sh"><button data-close>Cancel</button><h2>${state.edit ? "Edit" : "New"} transaction</h2><button data-save ${can ? "" : "disabled"}>Save</button></div>`;
  return `<section class="sheet" role="dialog" aria-label="Transaction">${head}<div class="sb">${body}</div>${phoneConfirm()}</section>`;
}
function phoneConfirm() {
  if (!state.confirm) return "";
  const del = state.confirm === "delete";
  return `<div class="scrim" data-cancelconfirm style="position:absolute;border-radius:14px 14px 0 0"></div><div style="position:absolute;z-index:62;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom))"><div class="icard" style="margin:0"><div class="irow" style="justify-content:center;font-size:13px;color:var(--muted)">${del ? "This Transaction will be deleted. This can't be undone." : "Discard your changes?"}</div><button class="irow bad" ${del ? "data-dodelete" : "data-dodiscard"}>${del ? "Delete Transaction" : "Discard changes"}</button></div><div class="icard" style="margin:8px 0 0"><button class="irow act" data-cancelconfirm style="justify-content:center;font-weight:600">${del ? "Cancel" : "Keep editing"}</button></div></div>`;
}

// ---------- C2: split rows ----------
// Every row is one Split read left to right. The shared Account repeats on later rows, locked, to show it can't differ.
function c2() {
  if (phone()) return state.mSplit !== null ? c2PhoneSplit(state.mSplit) : c2Phone();
  const t = tx();
  const cell = (side, i) => {
    if (side === t.shared) {
      if (i === 0) return pickBtn("anchor", { label: sideWord(side) });
      return `<button type="button" class="locked" data-focus-anchor title="Every Split shares this ${sideWord(side)} Account">${t.anchor ? acctMark(t.anchor) : ""}<span class="val">${acctName(t.anchor) || "Same as above"}</span>${ic("lock")}</button>`;
    }
    return pickBtn("line:" + i, { label: sideWord(side) });
  };
  const rows = t.lines.map((l, i) => `${cell("from", i)}<span class="arrow">${ic("arrow-right")}</span>${cell("to", i)}${amtInput(i)}<div class="acts">${tagBtn(i)}${removeBtn(i)}</div><div class="tags">${tagList(i)}</div>`).join("");
  const linesSide = t.shared === "from" ? "to" : "from";
  const adds = many()
    ? `<button type="button" class="link" data-addon="${linesSide}">${ic("plus")}Add a Split</button><span class="hint">Each new Split ${t.shared === "from" ? "comes from" : "goes to"} ${acctName(t.anchor) || "the same Account"}</span>`
    : `<button type="button" class="link" data-addon="to">${ic("plus")}Add a destination</button><button type="button" class="link" data-addon="from">${ic("plus")}Add a source</button>`;
  const body = `${topFields()}
    <div><div class="srows"><span class="h">From</span><span></span><span class="h">To</span><span class="h r">Amount</span><span></span>${rows}</div>
      <div class="adds" style="margin-top:10px;align-items:center">${adds}</div></div>
    ${filesBlock()}${historyBlock()}`;
  return dialog(body, 760);
}
function c2Phone() {
  const t = tx();
  const rows = t.lines.map((l, i) => {
    const f = t.shared === "from" ? t.anchor : l.acct, to = t.shared === "from" ? l.acct : t.anchor;
    const bad = err("line:" + i) || err("amt:" + i) || (i === 0 && err("anchor"));
    return `<button class="irow ${bad ? "err" : ""}" data-msplit="${i}"><span class="main"><span class="t">${to ? acctMark(to) + ACC[to].n : `<span class="muted">Pick where it went</span>`}</span><span class="s">from ${acctName(f) || "…"}${l.tags.length ? ", " + l.tags.map((k) => TAGS[k]).join(", ") : ""}</span></span><span style="font-size:16px">${l.amt ? money(parse(l.amt) || 0) : `<span class="muted">₹0</span>`}</span>${ic("chevron-right")}</button>`;
  }).join("");
  const linesSide = t.shared === "from" ? "to" : "from";
  const adds = many()
    ? `<button class="irow act" data-addon="${linesSide}" data-openlast>${ic("plus")}Add a Split</button>`
    : `<button class="irow act" data-addon="to" data-openlast>${ic("plus")}Add a destination</button><button class="irow act" data-addon="from" data-openlast>${ic("plus")}Add a source</button>`;
  return sheet(`${phoneTop()}<div class="ssec"><span>Splits</span><span>${money(sumLines())}</span></div><div class="icard">${rows}${adds}</div>${many() ? `<div class="sfoot">All ${t.lines.length} Splits ${t.shared === "from" ? "come from" : "go to"} ${acctName(t.anchor) || "one Account"}.</div>` : ""}${phoneBottom()}`);
}
function c2PhoneSplit(i) {
  const t = tx(), l = t.lines[i];
  const row = (side) => {
    const target = side === t.shared ? "anchor" : "line:" + i, id = acctOf(target);
    const shared = side === t.shared && many();
    return pickBtn(target, { noErr: true, custom: `<button type="button" class="irow ${err(target) ? "err" : ""}" data-pick="${target}"><span class="k">${sideWord(side)}</span><span class="v ${id ? "set" : ""}">${id ? acctMark(id) + ACC[id].n : "Pick"}</span>${shared ? `<span class="lk">${ic("link-2")}</span>` : ic("chevron-right")}</button>` });
  };
  const head = `<div class="sh"><button data-mback>${ic("chevron-left")}Back</button><h2>Split${many() ? ` ${i + 1} of ${t.lines.length}` : ""}</h2><span></span></div>`;
  const body = `<div class="ssec"><span>Money</span></div><div class="icard">${row("from")}${row("to")}<label class="irow ${err("amt:" + i) ? "err" : ""}"><span class="k">Amount</span><span class="muted">₹</span><input data-k="amt:${i}" inputmode="decimal" placeholder="0" value="${esc(pretty(l.amt, "amt:" + i))}"></label></div>
    ${many() ? `<div class="sfoot">${sideWord(t.shared)} is shared by every Split, so changing it here changes all ${t.lines.length}.</div>` : ""}
    <div class="ssec"><span>Tags</span></div><div class="icard">${pickBtn("tags:" + i, { custom: `<button type="button" class="irow" data-pick="tags:${i}"><span class="v ${l.tags.length ? "set" : ""}" style="justify-content:flex-start">${l.tags.length ? l.tags.map((k) => TAGS[k]).join(", ") : "Add Tags"}</span>${ic("chevron-right")}</button>` })}</div>
    ${many() ? `<div class="icard" style="margin-top:24px"><button class="irow bad" data-rm="${i}" data-mback>Remove this Split</button></div>` : ""}`;
  return sheet(body, { head });
}

// ---------- background page ----------
function bgRows() {
  const base = [["elunch", "Toit", "HDFC Regalia → Dining out", "−850.00", "15 Oct"], ["erefund", "Nature's Basket", "Groceries → ICICI Amazon Pay", "300.00", "10 Oct"], ["egroceries", "BigBasket", "HDFC Savings → Groceries + Household", "−2,260.00", "28 Sep"]];
  const saved = state.saved.map((s) => [null, s.party, s.desc, s.total, s.date, true]);
  return [...saved, ...base.filter(([k]) => !state.deleted.includes(k))];
}
function background() {
  const rows = bgRows();
  const desk = `<div class="desk"><header class="hdr">${LOGO}<span class="crumb"><span class="muted">/</span>Transactions</span><span class="sp"></span><span class="fake-search">${ic("search")}Search or jump to…<kbd>Ctrl K</kbd></span><span class="rel" style="flex-direction:row"><button class="btn primary split" data-new>${ic("plus")}New transaction</button><button class="btn primary" aria-label="More ways to add">${ic("chevron-down")}</button></span></header>
    <div class="shell"><nav class="side"><h4>Overview</h4><a href="#">${ic("house")}Home</a><a href="#" class="on">${ic("arrow-left-right")}Transactions</a><a href="#">${ic("inbox")}Drafts</a><h4>Plan</h4><a href="#">${ic("pie-chart")}Budgets</a><a href="#">${ic("repeat")}Schedules</a><h4>Money</h4><a href="#">${ic("landmark")}Accounts</a><a href="#">${ic("chart-candlestick")}Investments</a></nav>
    <main><div class="ph"><h1>Transactions</h1></div>
    <div class="box"><div class="box-h"><h3>Recent</h3><span class="hint">Click one to edit it</span></div>${rows.map(([k, p, d, a, dt, nw]) => `<button class="box-r txr ${nw ? "new" : ""}" ${k ? `data-editrow="${k}"` : ""}><span class="ic">${ic("arrow-left-right")}</span><div class="main"><div>${p}</div><div class="s">${d}</div></div><span class="s">${dt}</span><span class="num">₹${a}</span></button>`).join("")}</div></main></div></div>`;
  const mob = `<div class="mob"><div class="mbar">${LOGO}</div><div class="mtitle"><h1>Activity</h1></div><div class="mcard">${rows.map(([k, p, d, a]) => `<button class="mrow" ${k ? `data-editrow="${k}"` : ""}><span class="ic">${ic("arrow-left-right")}</span><div class="main"><div class="t">${p}</div><div class="s">${d}</div></div><span class="num">₹${a}</span></button>`).join("")}</div></div>
    <nav class="mtabs"><a href="#">${ic("house")}Home</a><a href="#" class="on">${ic("arrow-left-right")}Activity</a><button class="plus" data-new aria-label="New transaction"><span>${ic("plus")}</span></button><a href="#">${ic("pie-chart")}Budgets</a><a href="#">${ic("menu")}More</a></nav>`;
  return desk + mob;
}

// ---------- state panel ----------
function statePanel() {
  const t = tx(), e = errors();
  const splits = t.lines.map((l) => {
    const f = t.shared === "from" ? t.anchor : l.acct, to = t.shared === "from" ? l.acct : t.anchor;
    return `  ${acctName(f) || "?"} → ${acctName(to) || "?"}  ₹${fmtN(parse(l.amt) || 0)}${l.tags.length ? "  #" + l.tags.map((k) => TAGS[k]).join(" #") : ""}`;
  }).join("\n");
  const errs = Object.entries(e).map(([k, v]) => `  ${k}: ${v}`).join("\n");
  return `<pre class="state"><b>${state.edit ? "Would update" : "Would record"}</b>${state.edit ? `  ${dirty() ? "(changed)" : "(unchanged)"}` : ""}
date   ${t.date}
party  ${t.party ? PARTIES[t.party].n : "—"}
kind   ${kindOf() || "—"} (shared ${t.shared} side)
<b>Splits</b>
${splits}
<b>Attachments</b>  ${t.files.join(", ") || "—"}
${errs ? `<span class="bad">Can't save yet:\n${errs}</span>` : `<span class="ok">Ready to save</span>`}</pre>`;
}

// ---------- render ----------
function render() {
  const a = document.activeElement, key = a?.dataset?.k, pickKey = a?.dataset?.pick;
  focusKey = key;
  let sel = null; try { sel = key ? [a.selectionStart, a.selectionEnd] : null; } catch {}
  const root = document.documentElement;
  if (state.theme === "system") delete root.dataset.theme; else root.dataset.theme = state.theme;
  const editor = state.open ? `<div class="scrim" data-close></div>${state.variant === "C1" ? c1() : c2()}` : "";
  const toast = state.toast ? `<div class="toast">${ic("check")}${state.toast}</div>` : "";
  document.getElementById("app").innerHTML = background() + editor + toast + (state.showState && state.open ? statePanel() : "");
  window.lucide?.createIcons();
  const themes = { system: "Auto", light: "Light", dark: "Dark" };
  document.getElementById("proto").innerHTML = `
    <button data-p="prev" aria-label="Previous variant">‹</button>
    <select data-p="pick" aria-label="Variant">${Object.entries(VARIANTS).map(([k, n]) => `<option value="${k}" ${k === state.variant ? "selected" : ""}>${k}: ${n}</option>`).join("")}</select>
    <button data-p="next" aria-label="Next variant">›</button><span class="sep"></span>
    <select data-p="ex" aria-label="Example">${Object.entries(SCENARIOS).map(([k, s]) => `<option value="${k}" ${k === state.scenario ? "selected" : ""}>${s.t}</option>`).join("")}</select>
    <span class="sep"></span><button data-p="state">${state.showState ? "Hide" : "Show"} data</button><button data-p="theme">${themes[state.theme]}</button>`;
  if (key) {
    const el = document.querySelector(`[data-k="${key}"]`);
    if (el) { el.focus(); try { if (sel) el.setSelectionRange(...sel); } catch {} }
  } else if (state.picker) document.querySelector('[data-k="pq"]')?.focus();
  else if (pickKey) document.querySelector(`[data-pick="${pickKey}"]`)?.focus();
  document.querySelector(".pop .opt.hi")?.scrollIntoView({ block: "nearest" });
  const p = new URLSearchParams({ variant: state.variant, ex: state.scenario });
  if (state.theme !== "system") p.set("theme", state.theme);
  history.replaceState(null, "", "?" + p);
}

function focusAfter(target) {
  requestAnimationFrame(() => {
    const flow = [...document.querySelectorAll("[data-flow]")];
    const at = flow.findIndex((el) => el.dataset.pick === target);
    (flow[at + 1] || document.querySelector("[data-save]"))?.focus();
  });
}
function openPicker(target, q = "") { state.picker = { target, q, hi: 0 }; render(); }
function choose(o) {
  const target = state.picker.target;
  if (o.dataset.tag) {
    const tags = tx().lines[+target.split(":")[1]].tags, k = o.dataset.tag;
    tags.includes(k) ? tags.splice(tags.indexOf(k), 1) : tags.push(k);
    return render();
  }
  if (o.dataset.create) {
    const name = state.picker.q.trim(), kind = o.dataset.create;
    if (kind === "party") { const id = "p" + Date.now(); PARTIES[id] = { n: name }; tx().party = id; }
    else if (kind === "tag") { const id = "t" + Date.now(); TAGS[id] = name; tx().lines[+target.split(":")[1]].tags.push(id); state.picker.q = ""; return render(); }
    else if (kind === "asset" || kind === "liability") { alert(`A new ${KIND_T[kind]} Account needs its Opening Balance, so this opens the Account form on top, then comes back here with it picked.`); return; }
    else { const id = "a" + Date.now(); ACC[id] = { n: name, k: kind, i: "circle", hue: "#6e7781" }; setAcct(target, id); }
  } else if (target === "party") pickParty(o.dataset.choose || null);
  else setAcct(target, o.dataset.choose);
  state.picker = null;
  render();
  focusAfter(target);
}
// A Party fills in the Accounts from its last Transaction, but only into a new form the user hasn't started on.
function pickParty(id) {
  tx().party = id;
  const last = id && PARTIES[id].last, t = tx();
  if (last && !state.edit && !t.anchor && t.lines.every((l) => !l.acct)) {
    t.shared = last.shared; t.anchor = last.anchor;
    const amts = t.lines.map((l) => l.amt);
    t.lines = last.lines.map((acct, i) => ({ acct, amt: amts[i] || "", tags: [] }));
    flash(`Filled in from your last ${PARTIES[id].n} Transaction`);
  }
}
function flash(msg) { state.toast = msg; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { state.toast = null; render(); }, 2400); }
function close(force) {
  if (!force && state.edit && dirty()) { state.confirm = "discard"; return render(); }
  state.open = false; state.picker = state.confirm = state.mSplit = null; render();
}
function save() {
  if (state.edit && !dirty()) return;
  state.tried = true;
  if (Object.keys(errors()).length) { state.mSplit = null; return render(); }
  const t = tx(), total = sumLines();
  const row = { party: t.party ? PARTIES[t.party].n : "Transaction", desc: `${fromIds().map(acctName).join(" + ")} → ${toIds().map(acctName).join(" + ")}`, total: (kindOf() === "spent" ? "−" : "") + fmtN(total) + (Number.isInteger(total) ? ".00" : ""), date: fmtDate(t.date) };
  if (state.edit) state.deleted.push(state.edit.key);
  state.saved.unshift(row);
  const r = state.edit && reconciledHit();
  state.open = false; state.picker = state.confirm = state.mSplit = null;
  flash(state.edit ? (r ? `Changes saved. The ${fmtDate(r.through)} Reconciliation of ${ACC[r.id].n} no longer matches` : "Changes saved") : "Transaction saved");
}
function cycle(step) {
  const keys = Object.keys(VARIANTS);
  state.variant = keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length];
  state.picker = state.confirm = state.mSplit = null;
  render();
}
const focusLastLine = () => requestAnimationFrame(() => document.querySelector(`[data-pick="line:${tx().lines.length - 1}"]`)?.focus());

document.addEventListener("change", (e) => {
  const p = e.target.dataset.p;
  if (p === "pick") { state.variant = e.target.value; cycle(0); e.target.blur(); }
  if (p === "ex") { state.scenario = e.target.value; load(state.scenario); state.open = true; render(); e.target.blur(); }
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset.k; if (!k) return;
  const v = e.target.value;
  if (k === "pq") { state.picker.q = v; state.picker.hi = 0; }
  else if (k === "date" || k === "note") tx()[k] = v;
  else if (k.startsWith("amt:")) tx().lines[+k.split(":")[1]].amt = v;
  render();
});
// Amounts accept sums like 450+120 and settle into a grouped number when the field is left.
// The field is patched in place: re-rendering here would swap out a button mid-click.
document.addEventListener("focusout", (e) => {
  const k = e.target.dataset?.k; if (!k?.startsWith("amt:")) return;
  const v = parse(e.target.value);
  if (Number.isNaN(v)) return;
  if (/[+\-*/]/.test(e.target.value)) tx().lines[+k.split(":")[1]].amt = String(v);
  if (e.target.value) e.target.value = fmtN(v);
});
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href='#']"); if (a) e.preventDefault();
  const d = (sel) => e.target.closest(sel);
  const p = d("button[data-p]")?.dataset.p;
  if (p === "prev") return cycle(-1);
  if (p === "next") return cycle(1);
  if (p === "theme") { state.theme = { system: "light", light: "dark", dark: "system" }[state.theme]; return render(); }
  if (p === "state") { state.showState = !state.showState; return render(); }
  if (p) return;
  if (d("[data-new]")) { state.scenario = "blank"; load("blank"); state.open = true; return render(); }
  const er = d("[data-editrow]"); if (er) { state.scenario = er.dataset.editrow; load(state.scenario); state.open = true; return render(); }
  if (d("[data-closepick]")) { state.picker = null; return render(); }
  if (state.picker && !d(".pop") && !d("[data-pick]")) { state.picker = null; render(); return; }
  if (d("[data-cancelconfirm]")) { state.confirm = null; return render(); }
  if (d("[data-dodelete]")) { state.deleted.push(state.edit.key); close(true); return flash("Transaction deleted"); }
  if (d("[data-dodiscard]")) return close(true);
  if (d("[data-close]")) return close();
  if (d("[data-save]")) return save();
  const o = d(".pop .opt"); if (o) return choose(o);
  const pk = d("[data-pick]"); if (pk) { const t = pk.dataset.pick; return state.picker?.target === t ? (state.picker = null, render()) : openPicker(t); }
  if (d("[data-focus-anchor]")) return document.querySelector('[data-pick="anchor"]')?.focus();
  const ad = d("[data-addon]");
  if (ad) {
    addOn(ad.dataset.addon);
    if (ad.hasAttribute("data-openlast")) state.mSplit = tx().lines.length - 1;
    render(); return focusLastLine();
  }
  const rm = d("[data-rm]"); if (rm) { tx().lines.splice(+rm.dataset.rm, 1); if (rm.hasAttribute("data-mback")) state.mSplit = null; return render(); }
  if (d("[data-mback]")) { state.mSplit = null; return render(); }
  const ms = d("[data-msplit]"); if (ms) { state.mSplit = +ms.dataset.msplit; return render(); }
  const ut = d("[data-untag]"); if (ut) { const [i, k] = ut.dataset.untag.split(":"); const tags = tx().lines[+i].tags; tags.splice(tags.indexOf(k), 1); return render(); }
  const uf = d("[data-unfile]"); if (uf) { tx().files.splice(+uf.dataset.unfile, 1); return render(); }
  const act = d("[data-act]")?.dataset.act;
  if (act === "attach") { const next = FILES.find((f) => !tx().files.includes(f)); if (next) tx().files.push(next); return render(); }
  if (act === "delete") { state.confirm = "delete"; return render(); }
  if (act === "schedule") return alert("Opens a new Schedule filled in from this Transaction: same Party, Accounts, Splits and amounts, repeating monthly from its date.");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.picker) { const t = state.picker.target; state.picker = null; render(); return document.querySelector(`[data-pick="${t}"]`)?.focus(); }
    if (state.confirm) { state.confirm = null; return render(); }
    if (state.mSplit !== null) { state.mSplit = null; return render(); }
    if (state.open) return close();
  }
  if (state.open && (e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); return save(); }
  if (state.picker && e.target.dataset.k === "pq") {
    const opts = [...document.querySelectorAll(".pop .opt")];
    if (e.key === "ArrowDown") { e.preventDefault(); state.picker.hi = Math.min(opts.length - 1, state.picker.hi + 1); return render(); }
    if (e.key === "ArrowUp") { e.preventDefault(); state.picker.hi = Math.max(0, state.picker.hi - 1); return render(); }
    if (e.key === "Enter") { e.preventDefault(); const o = opts[state.picker.hi]; if (o) choose(o); return; }
    if (e.key === "Tab") { const t = state.picker.target; state.picker = null; render(); focusAfter(t); e.preventDefault(); return; }
    return;
  }
  // Typing on a closed picker opens it with that letter, so Tab + type picks an Account without the mouse.
  const pk = e.target.closest?.("[data-pick]");
  if (pk && e.key.length === 1 && !e.ctrlKey && !e.metaKey && /\S/.test(e.key)) { e.preventDefault(); return openPicker(pk.dataset.pick, e.key); }
  if (pk && (e.key === "ArrowDown" || e.key === "Enter")) { e.preventDefault(); return openPicker(pk.dataset.pick); }
  if (e.target.dataset?.k?.startsWith("amt:") && e.key === "Enter") { e.preventDefault(); const flow = [...document.querySelectorAll("[data-flow]")]; (flow[flow.indexOf(e.target) + 1] || document.querySelector("[data-save]")).focus(); return; }
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (!state.open && e.key.toLowerCase() === "n") { e.preventDefault(); state.scenario = "blank"; load("blank"); state.open = true; return render(); }
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
let lastPhone = phone();
addEventListener("resize", () => { if (phone() !== lastPhone) { lastPhone = phone(); render(); } });

load(state.scenario);
render();
requestAnimationFrame(() => document.querySelector("[data-flow]")?.focus());
</script>
</body>
</html>

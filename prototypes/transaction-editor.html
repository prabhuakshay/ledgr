<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers "How does entering a Transaction feel?" (issue #5).
  Three structurally different editors on prototype G's look (#2) and navigation A (#3):
    A  Kind tabs: Spent / Received / Moved / Refund pick the field labels and which Accounts each picker offers.
    B  Amount first: a big amount, one-tap chips for recent Parties and Accounts, and a keypad on phones.
    C  Flow: From boxes on the left, To boxes on the right; + only appears on the side ADR 0003 allows.
  The pink strip switches variant, loads a worked example (salary with deductions, refund, ...), toggles the theme
  and shows what would be recorded. Resize below 760px for the phone sheet. Nothing is saved anywhere.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledgr transaction editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 6px; }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }

body {
  --bg: light-dark(#ffffff, #000000);
  --subtle: light-dark(#f6f8fa, #0d1117);
  --muted-bg: light-dark(#eff2f5, #151b23);
  --border: light-dark(#d1d9e0, #30363d);
  --border-muted: light-dark(#e3e8ed, #21262d);
  --fg: light-dark(#1f2328, #e6edf3);
  --muted: light-dark(#59636e, #9198a1);
  --accent: light-dark(#0969da, #4493f8);
  --accent-bg: light-dark(#ddf4ff, #0c2d6b);
  --good: light-dark(#1a7f37, #3fb950);
  --bad: light-dark(#d1242f, #f85149);
  --attention: light-dark(#9a6700, #d29922);
  --primary: light-dark(#1f883d, #238636);
  --primary-hover: light-dark(#1c8139, #29903b);
  --btn: light-dark(#f6f8fa, #212830);
  --btn-hover: light-dark(#eff2f5, #262c36);
  --brand-ink: light-dark(#121418, #ece8df);
  --brand-green: light-dark(#13785a, #5fcb9f);
  --shadow: light-dark(0 1px 0 rgba(31,35,40,.04), none);
  --overlay-shadow: light-dark(0 8px 24px rgba(66,74,83,.2), 0 0 0 1px #30363d, 0 16px 32px rgba(0,0,0,.85));
  --page: light-dark(#f2f4f7, #000000);
  --card: light-dark(#ffffff, #0d1117);
  font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5;
  background: var(--bg); color: var(--fg);
  -webkit-font-smoothing: antialiased;
}
.logo { height: 24px; width: auto; display: block; color: var(--brand-ink); flex: none; }
.muted { color: var(--muted); }
.num { white-space: nowrap; flex: none; }
.num .dec { color: var(--muted); }
.box { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.box-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--subtle); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; }
.box-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.box-r { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border-muted); }
.box-h + .box-r { border-top: 0; }
.box-r .main { flex: 1; }
.box-r .s { color: var(--muted); font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--btn); color: var(--fg); font-weight: 500; white-space: nowrap; box-shadow: var(--shadow); flex: none; }
.btn:hover { background: var(--btn-hover); }
.btn.primary { background: var(--primary); border-color: rgba(31,35,40,.15); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.split { border-radius: 6px 0 0 6px; }
.btn.split + .btn { border-radius: 0 6px 6px 0; border-left-color: rgba(255,255,255,.25); padding: 0 6px; }
.btn.sm { height: 28px; padding: 0 8px; font-size: 12px; }
.btn.invis { background: none; border-color: transparent; box-shadow: none; color: var(--accent); }
.btn.invis:hover { background: var(--btn-hover); }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--btn-hover); color: var(--fg); }
.input { width: 100%; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
.input:focus, .pick:focus-visible { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.input.err, .pick.err { border-color: var(--bad); }
kbd { font-family: inherit; font-size: 11px; line-height: 18px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--bg); }
.label { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 500; white-space: nowrap; }
.label button { border: 0; background: none; padding: 0; color: var(--muted); display: grid; }
.label button svg { width: 12px; height: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hue, var(--muted)); flex: none; }
.fl { display: block; font-weight: 600; margin-bottom: 6px; }
.fl .muted { font-weight: 400; }
.err-t { color: var(--bad); font-size: 12px; margin-top: 4px; }
.hint { color: var(--muted); font-size: 12px; }

/* ---------- background page ---------- */
.hdr { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: var(--subtle); border-bottom: 1px solid var(--border); }
.hdr .crumb { font-weight: 600; display: flex; gap: 8px; }
.hdr .sp { flex: 1; }
.hdr .fake-search { width: 280px; height: 32px; border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); background: var(--bg); }
.hdr .fake-search kbd { margin-left: auto; }
.rel { position: relative; display: flex; }
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; max-width: 1200px; margin: 0 auto; padding: 24px; }
.side h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 8px 4px; }
.side h4:first-child { margin-top: 0; }
.side a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); position: relative; }
.side a.on { background: var(--muted-bg); font-weight: 600; }
.side a.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px; border-radius: 6px; background: var(--accent); }
.side a svg { color: var(--muted); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border-muted); }
.ph h1 { margin: 0; font-size: 24px; font-weight: 400; }
.txr .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--subtle); border: 1px solid var(--border); color: var(--muted); flex: none; }
.txr.new { background: color-mix(in srgb, var(--good) 8%, transparent); }
@media (max-width: 1000px) { .shell { grid-template-columns: 1fr; } .side { display: none; } }

.mob, .mtabs { display: none; }
@media (max-width: 760px) {
  body { background: var(--page); padding-bottom: 80px; }
  .desk { display: none; }
  .mob { display: block; }
  .mtabs { display: grid; }
}
.mbar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; }
.mtitle { padding: 2px 20px 14px; }
.mtitle h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.mcard { margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid light-dark(transparent, var(--border-muted)); overflow: hidden; }
.mrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; position: relative; }
.mrow + .mrow::before { content: ""; position: absolute; top: 0; right: 0; left: 60px; border-top: 1px solid var(--border-muted); }
.mrow .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--hue, #59636e); flex: none; }
.mrow .main { flex: 1; }
.mrow .t { font-size: 15px; font-weight: 500; }
.mrow .s { color: var(--muted); font-size: 13px; }
.mtabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); }
.mtabs a, .mtabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; font-size: 11px; font-weight: 500; color: var(--muted); border: 0; background: none; }
.mtabs a.on { color: var(--fg); font-weight: 600; }
.mtabs a svg { width: 22px; height: 22px; }
.mtabs .plus span { width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; margin-top: -18px; }
.mtabs .plus svg { width: 24px; height: 24px; }

/* ---------- editor shells: dialog (desktop) and sheet (phone) ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: light-dark(rgba(31,35,40,.5), rgba(1,4,9,.8)); }
.dlg { position: fixed; z-index: 61; top: 64px; left: 50%; transform: translateX(-50%); width: min(var(--w, 640px), calc(100% - 32px)); max-height: calc(100vh - 96px); display: flex; flex-direction: column; background: var(--bg); border-radius: 12px; box-shadow: var(--overlay-shadow); }
.dh { display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 16px; border-bottom: 1px solid var(--border-muted); }
.dh h2 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
.db { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.df { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border-muted); background: var(--subtle); border-radius: 0 0 12px 12px; }
.df .tot { flex: 1; display: flex; align-items: baseline; gap: 8px; }
.df .tot .num { font-size: 20px; font-weight: 600; }
.df .keys { font-size: 12px; color: var(--muted); margin-right: 8px; display: flex; gap: 12px; }
.row2 { display: grid; grid-template-columns: 160px 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 150px 1fr 1fr; gap: 12px; }

.sheet { position: fixed; z-index: 61; left: 0; right: 0; bottom: 0; top: 48px; display: flex; flex-direction: column; background: var(--page); border-radius: 14px 14px 0 0; box-shadow: var(--overlay-shadow); }
.sh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 52px; padding: 0 16px; }
.sh h2 { margin: 0; font-size: 17px; font-weight: 600; }
.sh button { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 0; }
.sh button:last-child { justify-self: end; font-weight: 600; }
.sh button:first-child { justify-self: start; }
.sb { flex: 1; overflow-y: auto; padding: 0 0 24px; }
.ssec { padding: 20px 20px 6px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
.sfoot { padding: 6px 20px 0; font-size: 13px; color: var(--muted); }
.icard { margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid light-dark(transparent, var(--border-muted)); }
.irow { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 16px; position: relative; width: 100%; border: 0; background: none; text-align: left; font-size: 16px; }
.irow + .irow::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: 1px solid var(--border-muted); }
.irow .k { color: var(--fg); flex: none; min-width: 96px; }
.irow .v { flex: 1; text-align: right; color: var(--muted); display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.irow .v.set { color: var(--fg); }
.irow input { flex: 1; border: 0; background: none; text-align: right; font-size: 16px; padding: 0; height: 32px; }
.irow input:focus { outline: none; }
.irow.err .k { color: var(--bad); }
.irow > svg:last-child { color: var(--muted); opacity: .6; }
.irow.act { color: var(--accent); }

/* ---------- pickers ---------- */
.pick { width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); text-align: left; }
.pick .ph-t { color: var(--muted); flex: 1; }
.pick .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick > svg:last-child { color: var(--muted); }
.pop { position: absolute; z-index: 70; left: 0; top: calc(100% + 4px); width: max(100%, 300px); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--overlay-shadow); overflow: hidden; }
.pop .pi { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border-muted); color: var(--muted); }
.pop .pi input { flex: 1; height: 40px; border: 0; background: none; color: var(--fg); }
.pop .pi input:focus { outline: none; }
.pop .pl { max-height: 300px; overflow-y: auto; padding: 6px; }
.pop h5 { margin: 6px 8px 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
.pop .opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: none; text-align: left; }
.pop .opt.hi { background: var(--muted-bg); }
.pop .opt .s { margin-left: auto; color: var(--muted); font-size: 12px; }
.pop .opt.create { color: var(--accent); }
.pop .opt .chk { width: 16px; color: var(--accent); }
.pop .pf { padding: 6px 12px; border-top: 1px solid var(--border-muted); font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  .pop { position: fixed; left: 0; right: 0; bottom: 0; top: 96px; width: auto; border-radius: 14px 14px 0 0; border: 0; display: flex; flex-direction: column; background: var(--page); }
  .pop .pi { margin: 12px 16px 4px; border: 0; border-radius: 10px; background: var(--muted-bg); }
  .pop .pi input { font-size: 16px; }
  .pop .pl { max-height: none; flex: 1; padding: 0 16px 24px; }
  .pop h5 { margin: 16px 4px 6px; font-size: 13px; }
  .pop .opt { min-height: 48px; font-size: 16px; background: var(--card); border-radius: 0; border-top: 1px solid var(--border-muted); }
  .pop .opt.hi { background: var(--card); }
  .pop .pf { display: none; }
  .pop .ptop { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 0; font-weight: 600; font-size: 17px; }
  .pop .ptop button { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 0; }
}
.ptop { display: none; }
@media (max-width: 760px) { .ptop { display: flex; } }

/* ---------- variant A: kind tabs ---------- */
.seg { display: flex; padding: 2px; border-radius: 8px; background: var(--muted-bg); border: 1px solid var(--border-muted); }
.seg button { flex: 1; height: 30px; border: 0; border-radius: 6px; background: none; font-weight: 500; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px var(--border), var(--shadow); font-weight: 600; }
.lines { border: 1px solid var(--border); border-radius: 6px; }
.lines .lh { display: grid; grid-template-columns: 1fr 120px 150px 32px; gap: 8px; padding: 8px 12px; background: var(--subtle); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.lines .ln { display: grid; grid-template-columns: 1fr 120px 150px 32px; gap: 8px; padding: 8px 12px; align-items: start; border-top: 1px solid var(--border-muted); }
.lines .lh + .ln { border-top: 0; }
.lines .lf { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-top: 1px solid var(--border-muted); }
.tagcell { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 32px; }
.amt { text-align: right; font-weight: 500; }
.shared-note { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 6px; }
.drop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 6px; color: var(--muted); }
.drop .btn { margin-left: auto; }
.file { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--subtle); color: var(--fg); font-size: 12px; }
.file button { border: 0; background: none; color: var(--muted); display: grid; padding: 2px; }
.file button svg { width: 14px; height: 14px; }

/* ---------- variant B: amount first ---------- */
.hero { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 4px; }
.hero .big { display: flex; align-items: baseline; justify-content: center; gap: 4px; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.hero .big span { color: var(--muted); font-weight: 400; }
.hero .big input { min-width: 1.6ch; border: 0; background: none; font-size: inherit; font-weight: inherit; letter-spacing: inherit; text-align: center; padding: 0; }
.hero .big input:focus { outline: none; }
.hero .big input::placeholder { color: var(--border); }
.hero .big.kp { cursor: pointer; }
.hero .big.kp .v.ph { color: var(--border); }
.hero .sub { color: var(--muted); font-size: 13px; min-height: 20px; }
.crow { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; }
.crow > .lbl { font-weight: 600; padding-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); font-weight: 500; white-space: nowrap; }
.chip:hover { background: var(--btn-hover); }
.chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--fg); }
.chip.more { color: var(--accent); border-style: dashed; }
.chip.err { border-color: var(--bad); }
.blines { display: flex; flex-direction: column; gap: 6px; }
.bline { display: grid; grid-template-columns: 1fr 140px 32px; gap: 8px; align-items: center; }
.bline .tags { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; margin: -2px 0 4px; }
.left { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 10px; border-radius: 6px; }
.left.off { background: color-mix(in srgb, var(--attention) 12%, transparent); color: var(--attention); }
.left.ok { color: var(--good); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--border-muted); }
.tools .input { width: auto; flex: 1; min-width: 160px; }
.tools input[type=date] { flex: none; width: 150px; }
.menu { position: absolute; z-index: 70; top: calc(100% + 4px); left: 0; width: 300px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--overlay-shadow); padding: 6px; }
.menu button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: none; text-align: left; }
.menu button:hover { background: var(--muted-bg); }
.menu button span { color: var(--muted); font-size: 12px; }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); background: light-dark(#d5d9de, #1c2128); }
.keypad button { height: 48px; border: 0; border-radius: 8px; background: light-dark(#fff, #3d444d); font-size: 22px; font-weight: 500; display: grid; place-items: center; }
.keypad button.fn { background: light-dark(#b9bfc7, #2d333b); font-size: 16px; }
.keypad button.done { background: var(--primary); color: #fff; font-size: 16px; grid-row: span 2; height: auto; }
.mchips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
.mchips .chip { height: 36px; font-size: 15px; background: var(--card); border-color: var(--border-muted); }
.mchips .chip.on { background: var(--accent-bg); border-color: var(--accent); }

/* ---------- variant C: flow ---------- */
.flow { display: grid; grid-template-columns: 1fr 72px 1fr; column-gap: 0; row-gap: 12px; }
.flow .colh { font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.flow .colh .hint { font-weight: 400; }
.fbox { border: 1px solid var(--border); border-radius: 6px; padding: 10px; background: var(--subtle); display: flex; flex-direction: column; gap: 8px; height: 100%; justify-content: center; }
.fbox.anchor { background: var(--bg); }
.fbox .fr { display: flex; gap: 6px; align-items: center; }
.fbox .fr .input.amt { width: 130px; flex: none; }
.fbox .tags { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.flow svg.wires { width: 72px; overflow: visible; }
.wires path { fill: none; stroke: var(--border); stroke-width: 1.5; }
.wires .head { fill: var(--border); stroke: none; }

const params = new URLSearchParams(location.search);
const state = {

function load(key) {

  state.tx.total = String(sumLines() || "");

  state.picker = state.menu = state.keypad = null;

// ---------- money ----------
const fmtN = (n) => new Intl.NumberFormat("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
function parse(s) {
  s = String(s ?? "").replace(/[₹,\s]/g, "");
  if (!s) return 0;
  if (!/^[\d.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function(`"use strict";return (${s})`)(); return Number.isFinite(v) ? Math.round(v * 100) / 100 : NaN; } catch { return NaN; }
}
function money(n) {
  const [i, d] = Math.abs(n).toFixed(2).split(".");
  return `<span class="num">₹${fmtN(Number(i))}<span class="dec">.${d}</span></span>`;
}
// Amounts show grouped (85,000) except in the field being typed in.
let focusKey = null;
function pretty(s, k) {
  if (!s || k === focusKey || /[+\-*/]/.test(s)) return s;
  const n = parse(s);
  return Number.isNaN(n) ? s : fmtN(n);
}
const sumLines = () => state.tx.lines.reduce((a, l) => a + (parse(l.amt) || 0), 0);

// ---------- the Transaction's shape (ADR 0003) ----------
// One side is shared by every Split ("anchor"); the other side is one Account per Split ("lines").
const tx = () => state.tx;
const fromIds = () => (tx().shared === "from" ? [tx().anchor] : tx().lines.map((l) => l.acct)).filter(Boolean);
const toIds = () => (tx().shared === "to" ? [tx().anchor] : tx().lines.map((l) => l.acct)).filter(Boolean);
const kindsOf = (ids) => new Set(ids.map((id) => ACC[id].k));
function deriveKind() {
  const f = kindsOf(fromIds()), t = kindsOf(toIds());
  if (f.has("income")) return "received";
  if (f.has("expense")) return "refund";
  if (t.has("expense")) return "spent";
  if (f.size && t.size) return "moved";
  return null;
}
// Which kinds of Account a side may hold, given the other side. Variant A narrows this further by its tab.
function allowedKinds(side) {
  if (state.variant === "A") return side === "from" ? KINDS[state.kind].fromK : KINDS[state.kind].toK;
  const other = kindsOf(side === "from" ? toIds() : fromIds());
  const all = ["asset", "liability", "income", "expense"];
  return all.filter((k) => {
    if (side === "to" && k === "income") return false;
    if (k === "expense" && (other.has("expense") || other.has("income"))) return false;
    if (side === "from" && k === "income" && other.has("expense")) return false;
    return true;
  });
}
const sideOf = (target) => (target === "anchor" ? tx().shared : tx().shared === "from" ? "to" : "from");
function setAcct(target, id) {
  if (target === "anchor") tx().anchor = id;
  else tx().lines[+target.split(":")[1]].acct = id;
  if (state.variant !== "A") state.kind = deriveKind() || state.kind;
}
function addLine(amt = "") { tx().lines.push({ acct: null, amt, tags: [] }); }
// Let the other side become the many: the single line's Account becomes the anchor, the old anchor a line.
function flip() {
  const t = tx(), only = t.lines[0];
  t.lines = [{ acct: t.anchor, amt: only.amt, tags: only.tags }];
  t.anchor = only.acct;
  t.shared = t.shared === "from" ? "to" : "from";
}
function errors() {
  const t = tx(), e = {};
  if (!t.date) e.date = "Pick a date";
  if (t.date > today) e.date = "A Transaction can't be dated after today; save it as a Draft instead";
  if (!t.anchor) e.anchor = "Pick an Account";
  t.lines.forEach((l, i) => {
    if (!l.acct) e["line:" + i] = "Pick an Account";
    const v = parse(l.amt);
    if (!(v > 0)) e["amt:" + i] = Number.isNaN(v) ? "Not a number" : "Enter an amount";
  });
  if (state.variant === "B" && t.lines.length > 1) {
    const left = (parse(t.total) || 0) - sumLines();
    if (Math.abs(left) > 0.001) e.left = left;
  }
  return e;
}
const err = (k) => (state.tried ? errors()[k] : null);

// ---------- small pieces ----------
const ic = (n) => `<i data-lucide="${n}"></i>`;
const phone = () => innerWidth <= 760;
function acctMark(id) {

}
const acctName = (id) => (id ? ACC[id].n : "");

function pickBtn(target, opts = {}) {
  const isParty = target === "party", isTag = target.startsWith("tags");

    ? opts.custom
    : `<button type="button" class="pick ${err(target) ? "err" : ""}" data-pick="${target}" data-flow ${opts.label ? `aria-label="${opts.label}"` : ""}>${val || `<span class="ph-t">${ph}</span>`}${ic("chevron-down")}</button>`;
  return `<div class="rel" style="flex-direction:column">${btn}${state.picker?.target === target ? picker() : ""}${err(target) && !opts.noErr ? `<div class="err-t">${err(target)}</div>` : ""}</div>`;
}

function pickerOptions() {
  const p = state.picker, q = p.q.trim().toLowerCase(), m = (s) => s.toLowerCase().includes(q);
  const out = [];

    const rec = q ? [] : RECENT_PARTY;

    const rest = Object.keys(PARTIES).filter((id) => (q ? m(PARTIES[id].n) : !rec.includes(id)));
    if (rest.length) out.push({ h: q ? "Parties" : "All Parties" }, ...rest.map((id) => ({ id, label: PARTIES[id].n, icon: ic("user"), s: lastHint(id) })));
    if (q && !Object.values(PARTIES).some((x) => x.n.toLowerCase() === q)) out.push({ create: "party", label: `Create Party “${p.q.trim()}”`, icon: ic("plus") });
    if (tx().party) out.push({ h: "" }, { id: null, label: "No Party", icon: ic("x") });
    return out;
  }
  if (p.target.startsWith("tags")) {
    const i = +p.target.split(":")[1], on = tx().lines[i].tags;
    const ids = Object.keys(TAGS).filter((k) => m(TAGS[k]));
    out.push(...ids.map((k) => ({ tag: k, label: TAGS[k], icon: `<span class="chk">${on.includes(k) ? ic("check") : ""}</span>` })));
    if (q && !Object.values(TAGS).some((x) => x.toLowerCase() === q)) out.push({ create: "tag", label: `Create Tag “${p.q.trim()}”`, icon: ic("plus") });
    return out;
  }
  const side = sideOf(p.target), kinds = allowedKinds(side);
  const taken = new Set([tx().anchor, ...tx().lines.map((l) => l.acct)].filter(Boolean));
  const ok = (id) => kinds.includes(ACC[id].k) && !taken.has(id);
  const row = (id) => ({ id, label: ACC[id].n, icon: acctMark(id), s: KIND_T[ACC[id].k] });
  if (!q) {
    const rec = RECENT_ACC.filter(ok).slice(0, 5);

  }
  for (const k of kinds) {
    const ids = Object.keys(ACC).filter((id) => ACC[id].k === k && ok(id) && (!q || m(ACC[id].n)));
    if (ids.length) out.push({ h: KIND_T[k] + " Accounts" }, ...ids.map(row));
  }
  if (q && !Object.values(ACC).some((a) => a.n.toLowerCase() === q)) {
    for (const k of kinds) out.push({ create: k, label: `Create ${KIND_T[k]} Account “${p.q.trim()}”`, icon: ic("plus") });
  }
  return out;
}

}

  const p = state.picker, opts = pickerOptions();
  let n = -1;
  const title = p.target === "party" ? "Party" : p.target.startsWith("tags") ? "Tags" : (state.variant === "A" ? (sideOf(p.target) === "from" ? KINDS[state.kind].from : KINDS[state.kind].to) : sideOf(p.target) === "from" ? "From" : "To");

    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${filesRow()}<button type="button" class="btn sm" data-act="attach">${ic("paperclip")}Attach a file</button></div>`;
  return `<div class="dlg" style="--w:820px" role="dialog" aria-label="New transaction"><div class="dh"><h2>New transaction</h2><button class="iconbtn" data-close aria-label="Close">${ic("x")}</button></div><div class="db">${body}</div>${footer()}</div>`;
}

function sheet(body, after = "") {
  return `<section class="sheet" role="dialog" aria-label="New transaction"><div class="sh"><button data-close>Cancel</button><h2>New transaction</h2><button data-save>Save</button></div><div class="sb">${body}</div>${after}</section>`;
}

// ---------- background page ----------
function bgRows() {
  const base = [["Swiggy", "ICICI Amazon Pay → Dining out", "-412.00", "15 Oct"], ["SBI Salary", "SBI Salary → HDFC Savings", "20,000.00", "14 Oct"], ["Shell, Baner", "HDFC Regalia → Fuel", "-2,100.00", "13 Oct"], ["Mr Kulkarni (landlord)", "HDFC Savings → Rent", "-28,000.00", "1 Oct"]];
  const saved = state.saved.map((s) => [s.party, s.desc, s.total, "16 Oct", true]);
  return [...saved, ...base];
}
function background() {
  const rows = bgRows();
  const desk = `<div class="desk"><header class="hdr">${LOGO}<span class="crumb"><span class="muted">/</span>Transactions</span><span class="sp"></span><span class="fake-search">${ic("search")}Search or jump to…<kbd>Ctrl K</kbd></span><span class="rel"><button class="btn primary split" data-open>${ic("plus")}New transaction</button><button class="btn primary" aria-label="More ways to add">${ic("chevron-down")}</button></span></header>
    <div class="shell"><nav class="side"><h4>Overview</h4><a href="#">${ic("house")}Home</a><a href="#" class="on">${ic("arrow-left-right")}Transactions</a><a href="#">${ic("inbox")}Drafts</a><h4>Plan</h4><a href="#">${ic("pie-chart")}Budgets</a><a href="#">${ic("repeat")}Schedules</a><h4>Money</h4><a href="#">${ic("landmark")}Accounts</a><a href="#">${ic("chart-candlestick")}Investments</a></nav>
    <main><div class="ph"><h1>Transactions</h1><button class="btn" data-open>${ic("plus")}New transaction <kbd>N</kbd></button></div>
    <div class="box"><div class="box-h"><h3>October</h3></div>${rows.map(([p, d, a, dt, nw]) => `<div class="box-r txr ${nw ? "new" : ""}"><span class="ic">${ic("arrow-left-right")}</span><div class="main"><div>${p}</div><div class="s">${d}</div></div><span class="s">${dt}</span><span class="num">₹${a.replace("-", "−")}</span></div>`).join("")}</div></main></div></div>`;
  const mob = `<div class="mob"><div class="mbar">${LOGO}</div><div class="mtitle"><h1>Activity</h1></div><div class="mcard">${rows.map(([p, d, a]) => `<div class="mrow"><span class="ic">${ic("arrow-left-right")}</span><div class="main"><div class="t">${p}</div><div class="s">${d}</div></div><span class="num">₹${a.replace("-", "−")}</span></div>`).join("")}</div></div>
    <nav class="mtabs"><a href="#">${ic("house")}Home</a><a href="#" class="on">${ic("arrow-left-right")}Activity</a><button class="plus" data-open aria-label="New transaction"><span>${ic("plus")}</span></button><a href="#">${ic("pie-chart")}Budgets</a><a href="#">${ic("menu")}More</a></nav>`;
  return desk + mob;
}

// ---------- state panel ----------
function statePanel() {
  const t = tx(), e = errors();
  const splits = t.lines.map((l, i) => {
    const f = t.shared === "from" ? t.anchor : l.acct, to = t.shared === "from" ? l.acct : t.anchor;
    return `  ${acctName(f) || "?"} → ${acctName(to) || "?"}  ₹${fmtN(parse(l.amt) || 0)}${l.tags.length ? "  #" + l.tags.map((k) => TAGS[k]).join(" #") : ""}`;
  }).join("\n");
  const errs = Object.entries(e).map(([k, v]) => `  ${k}: ${typeof v === "number" ? "₹" + fmtN(v) + " unassigned" : v}`).join("\n");
  return `<pre class="state" style="margin:0;white-space:pre-wrap"><b>Would record</b>
date   ${t.date}
party  ${t.party ? PARTIES[t.party].n : "—"}
kind   ${deriveKind() || "—"} (shared ${t.shared} side)
<b>Splits</b>
${splits}
<b>Attachments</b>  ${t.files.join(", ") || "—"}
${errs ? `<span class="bad">Can't save yet:\n${errs}</span>` : `<span class="ok">Ready to save</span>`}</pre>`;
}

// ---------- render ----------
function render() {
  const a = document.activeElement, key = a?.dataset?.k, pickKey = a?.dataset?.pick;
  focusKey = key;
  let sel = null; try { sel = key ? [a.selectionStart, a.selectionEnd] : null; } catch {}
  const root = document.documentElement;
  if (state.theme === "system") delete root.dataset.theme; else root.dataset.theme = state.theme;
  const editor = state.open ? `<div class="scrim" data-close></div>${{ A: variantA, B: variantB, C: variantC }[state.variant]()}` : "";
  const toast = state.toast ? `<div class="toast">${ic("check")}${state.toast}</div>` : "";
  document.getElementById("app").innerHTML = background() + editor + toast + (state.showState && state.open ? statePanel() : "");
  window.lucide?.createIcons();
  const themes = { system: "Auto", light: "Light", dark: "Dark" };
  document.getElementById("proto").innerHTML = `
    <button data-p="prev" aria-label="Previous variant">‹</button>
    <select data-p="pick" aria-label="Variant">${Object.entries(VARIANTS).map(([k, n]) => `<option value="${k}" ${k === state.variant ? "selected" : ""}>${k}: ${n}</option>`).join("")}</select>
    <button data-p="next" aria-label="Next variant">›</button><span class="sep"></span>
    <select data-p="ex" aria-label="Example">${Object.entries(SCENARIOS).map(([k, s]) => `<option value="${k}" ${k === state.scenario ? "selected" : ""}>Example: ${s.t}</option>`).join("")}</select>
    <span class="sep"></span><button data-p="state">${state.showState ? "Hide" : "Show"} data</button><button data-p="theme">${themes[state.theme]}</button>`;
  if (key) {
    const el = document.querySelector(`[data-k="${key}"]`);
    if (el) { el.focus(); try { if (sel) el.setSelectionRange(...sel); } catch {} }
  } else if (state.picker) document.querySelector('[data-k="pq"]')?.focus();
  else if (pickKey) document.querySelector(`[data-pick="${pickKey}"]`)?.focus();
  document.querySelector(".pop .opt.hi")?.scrollIntoView({ block: "nearest" });
  const p = new URLSearchParams({ variant: state.variant, ex: state.scenario });
  if (state.theme !== "system") p.set("theme", state.theme);
  history.replaceState(null, "", "?" + p);
}

// Move focus to the next field in the form after a picker closes, so keyboard entry flows.
function focusAfter(target) {
  requestAnimationFrame(() => {
    const flow = [...document.querySelectorAll("[data-flow]")];
    const at = flow.findIndex((el) => el.dataset.pick === target);
    (flow[at + 1] || document.querySelector("[data-save]"))?.focus();
  });
}
function openPicker(target, q = "") { state.picker = { target, q, hi: 0 }; state.menu = null; render(); }
function choose(o) {
  const target = state.picker.target;
  if (o.dataset.tag) {
    const tags = tx().lines[+target.split(":")[1]].tags, k = o.dataset.tag;
    tags.includes(k) ? tags.splice(tags.indexOf(k), 1) : tags.push(k);
    return render();
  }
  if (o.dataset.create) {
    const name = state.picker.q.trim(), kind = o.dataset.create;
    if (kind === "party") { const id = "p" + Date.now(); PARTIES[id] = { n: name }; tx().party = id; }
    else if (kind === "tag") { const id = "t" + Date.now(); TAGS[id] = name; tx().lines[+target.split(":")[1]].tags.push(id); state.picker.q = ""; return render(); }
    else if (kind === "asset" || kind === "liability") { alert(`Creating an ${KIND_T[kind]} Account needs its Opening Balance, so it opens the full Account form here, then returns to this Transaction.`); return; }
    else { const id = "a" + Date.now(); ACC[id] = { n: name, k: kind, i: "circle", hue: "#6e7781" }; setAcct(target, id); }
  } else if (target === "party") pickParty(o.dataset.choose || null);
  else setAcct(target, o.dataset.choose);
  state.picker = null;
  render();
  focusAfter(target);
}
// A Party fills in the Accounts from its last Transaction, but only into a form the user hasn't started on.
function pickParty(id) {
  tx().party = id;
  const last = id && PARTIES[id].last, t = tx();
  if (last && !t.anchor && t.lines.every((l) => !l.acct)) {
    t.shared = last.shared; t.anchor = last.anchor;
    const amts = t.lines.map((l) => l.amt);
    t.lines = last.lines.map((acct, i) => ({ acct, amt: amts[i] || "", tags: [] }));
    if (state.variant === "B" && t.lines.length > 1) { t.lines[0].amt = t.total; }
    state.kind = deriveKind() || state.kind;
    state.toast = `Filled in from your last ${PARTIES[id].n} Transaction`;
    setTimeout(() => { state.toast = null; render(); }, 2200);
  }
}
function save() {
  state.tried = true;
  if (Object.keys(errors()).length) return render();
  const t = tx();
  const total = sumLines(), out = deriveKind() === "spent";
  state.saved.unshift({ party: t.party ? PARTIES[t.party].n : describe() || "Transaction", desc: `${fromIds().map(acctName).join(" + ")} → ${toIds().map(acctName).join(" + ")}`, total: (out ? "-" : "") + fmtN(total) + (String(total).includes(".") ? "" : ".00") });
  state.open = false;
  state.toast = "Transaction saved";
  setTimeout(() => { state.toast = null; render(); }, 2200);
  render();
}
function cycle(step) {
  const keys = Object.keys(VARIANTS);
  state.variant = keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length];
  state.picker = state.menu = state.keypad = null;
  if (state.variant !== "A") state.kind = deriveKind() || state.kind;
  render();
}

document.addEventListener("change", (e) => {
  const p = e.target.dataset.p;
  if (p === "pick") { state.variant = e.target.value; cycle(0); e.target.blur(); }
  if (p === "ex") { state.scenario = e.target.value; load(state.scenario); state.open = true; render(); e.target.blur(); }
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset.k; if (!k) return;
  const v = e.target.value;
  if (k === "pq") { state.picker.q = v; state.picker.hi = 0; }
  else if (k === "date" || k === "note") tx()[k] = v;
  else if (k === "total") { tx().total = v; if (tx().lines.length === 1) tx().lines[0].amt = v; }
  else if (k.startsWith("amt:")) tx().lines[+k.split(":")[1]].amt = v;
  render();
});
// Amounts accept sums like 450+120; they settle into a plain number when the field is left.
document.addEventListener("focusout", (e) => {
  const k = e.target.dataset?.k; if (!k || !(k === "total" || k.startsWith("amt:"))) return;
  // Patch the field in place: re-rendering here would swap out a button mid-click.
  const v = parse(e.target.value);
  if (Number.isNaN(v)) return;
  if (/[+\-*/]/.test(e.target.value)) {
    const s = String(v);
    if (k === "total") { tx().total = s; if (tx().lines.length === 1) tx().lines[0].amt = s; } else tx().lines[+k.split(":")[1]].amt = s;
  }
  if (e.target.value) e.target.value = fmtN(v);
});
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href='#']"); if (a) e.preventDefault();
  const d = (sel) => e.target.closest(sel);
  const p = d("button[data-p]")?.dataset.p;
  if (p === "prev") return cycle(-1);
  if (p === "next") return cycle(1);
  if (p === "theme") { state.theme = { system: "light", light: "dark", dark: "system" }[state.theme]; return render(); }
  if (p === "state") { state.showState = !state.showState; return render(); }
  if (p) return;
  if (d("[data-open]")) { load(state.scenario); state.open = true; return render(); }
  if (d("[data-closepick]")) { state.picker = null; return render(); }
  if (state.picker && !d(".pop") && !d("[data-pick]")) { state.picker = null; render(); if (!d("[data-close]")) return; }
  if (d("[data-close]")) { state.open = false; state.picker = state.menu = state.keypad = null; return render(); }
  if (d("[data-save]")) return save();
  const o = d(".pop .opt"); if (o) return choose(o);
  const pk = d("[data-pick]"); if (pk) { const t = pk.dataset.pick; return state.picker?.target === t ? (state.picker = null, render()) : openPicker(t); }
  const kd = d("[data-kind]");
  if (kd) {
    // Switching tab keeps only the Accounts the new tab still allows.
    state.kind = kd.dataset.kind;
    const K = KINDS[state.kind], t = tx();
    const okFor = (side) => (id) => id && (side === "from" ? K.fromK : K.toK).includes(ACC[id].k);
    if (!okFor(t.shared)(t.anchor)) t.anchor = null;
    const lineSide = t.shared === "from" ? "to" : "from";
    t.lines.forEach((l) => { if (!okFor(lineSide)(l.acct)) l.acct = null; });
    return render();
  }
  if (d("[data-add]")) { addLine(state.variant === "B" ? String(Math.max(0, (parse(tx().total) || 0) - sumLines()) || "") : ""); render(); return requestAnimationFrame(() => document.querySelector(`[data-pick="line:${tx().lines.length - 1}"]`)?.focus()); }
  if (d("[data-flip]")) { flip(); addLine(); render(); return requestAnimationFrame(() => document.querySelector(`[data-pick="line:${tx().lines.length - 1}"]`)?.focus()); }
  if (d("[data-flipadd]")) { flip(); addLine(); return render(); }
  const rm = d("[data-rm]"); if (rm) { tx().lines.splice(+rm.dataset.rm, 1); if (state.variant === "B" && tx().lines.length === 1) tx().lines[0].amt = tx().total; return render(); }
  const ut = d("[data-untag]"); if (ut) { const [i, k] = ut.dataset.untag.split(":"); const tags = tx().lines[+i].tags; tags.splice(tags.indexOf(k), 1); return render(); }
  const uf = d("[data-unfile]"); if (uf) { tx().files.splice(+uf.dataset.unfile, 1); return render(); }
  if (d("[data-act=attach]")) { const next = FILES.find((f) => !tx().files.includes(f)); if (next) tx().files.push(next); return render(); }
  // ---- variant B ----
  const ch = d("[data-chip]"); if (ch) { const c = ch.dataset.chip, target = c.slice(0, c.lastIndexOf(":")), id = c.slice(c.lastIndexOf(":") + 1); setAcct(target, id); return render(); }
  const pc = d("[data-pchip]"); if (pc) { pickParty(tx().party === pc.dataset.pchip ? null : pc.dataset.pchip); return render(); }
  const tc = d("[data-tagchip]"); if (tc) { const tags = tx().lines[0].tags, k = tc.dataset.tagchip; tags.includes(k) ? tags.splice(tags.indexOf(k), 1) : tags.push(k); return render(); }
  const mn = d("[data-menu]"); if (mn) { state.menu = state.menu ? null : mn.dataset.menu; return render(); }
  const sp = d("[data-split]");
  if (sp) {
    // Splitting keeps the whole amount on the first part; the user takes some off it for the next.
    const side = sp.dataset.split, t = tx();
    if ((side === "to") !== (t.shared === "from")) flip();
    t.lines[0].amt = t.total; addLine("");
    state.menu = null; render();
    return requestAnimationFrame(() => document.querySelector('[data-k="amt:0"]')?.select());
  }
  if (d("[data-unsplit]")) { tx().lines = [{ ...tx().lines[0], amt: tx().total }]; return render(); }
  if (d("[data-fill]")) { addLine(String((parse(tx().total) || 0) - sumLines())); render(); return requestAnimationFrame(() => document.querySelector(`[data-pick="line:${tx().lines.length - 1}"]`)?.focus()); }
  const kp = d("[data-kp]"); if (kp) { state.keypad = kp.dataset.kp; return render(); }
  const key = d("[data-key]");
  if (key) {
    const v = key.dataset.key, t = tx(), target = state.keypad;
    if (v === "done") { state.keypad = null; const n = parse(target === "total" ? t.total : t.lines[+target.split(":")[1]].amt); const s = Number.isNaN(n) ? "" : n ? String(n) : ""; if (target === "total") { t.total = s; if (t.lines.length === 1) t.lines[0].amt = s; } else t.lines[+target.split(":")[1]].amt = s; return render(); }
    let cur = target === "total" ? t.total : t.lines[+target.split(":")[1]].amt;
    cur = v === "back" ? cur.slice(0, -1) : cur + v;
    if (target === "total") { t.total = cur; if (t.lines.length === 1) t.lines[0].amt = cur; } else t.lines[+target.split(":")[1]].amt = cur;
    return render();
  }
  if (state.menu && !d(".menu")) { state.menu = null; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.picker) { const t = state.picker.target; state.picker = null; render(); return document.querySelector(`[data-pick="${t}"]`)?.focus(); }
    if (state.menu || state.keypad) { state.menu = state.keypad = null; return render(); }
    if (state.open) { state.open = false; return render(); }
  }
  if (state.open && (e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); return save(); }
  if (state.picker && e.target.dataset.k === "pq") {
    const opts = [...document.querySelectorAll(".pop .opt")];
    if (e.key === "ArrowDown") { e.preventDefault(); state.picker.hi = Math.min(opts.length - 1, state.picker.hi + 1); return render(); }
    if (e.key === "ArrowUp") { e.preventDefault(); state.picker.hi = Math.max(0, state.picker.hi - 1); return render(); }
    if (e.key === "Enter") { e.preventDefault(); const o = opts[state.picker.hi]; if (o) choose(o); return; }
    if (e.key === "Tab") { state.picker = null; render(); return; }
    return;
  }
  // Typing on a closed picker opens it with that letter, so Tab + type picks an Account without the mouse.
  const pk = e.target.closest?.("[data-pick]");
  if (pk && e.key.length === 1 && !e.ctrlKey && !e.metaKey && /\S/.test(e.key)) { e.preventDefault(); return openPicker(pk.dataset.pick, e.key); }
  if (pk && (e.key === "ArrowDown" || e.key === "Enter")) { e.preventDefault(); return openPicker(pk.dataset.pick); }
  if (e.target.dataset?.k?.startsWith("amt:") && e.key === "Enter") { e.preventDefault(); const flow = [...document.querySelectorAll("[data-flow]")]; (flow[flow.indexOf(e.target) + 1] || document.querySelector("[data-save]")).focus(); return; }
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (!state.open && e.key.toLowerCase() === "n") { e.preventDefault(); load(state.scenario); state.open = true; return render(); }
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
let lastPhone = phone();
addEventListener("resize", () => { if (phone() !== lastPhone) { lastPhone = phone(); render(); } });

load(state.scenario);
render();
requestAnimationFrame(() => document.querySelector("[data-flow]")?.focus());
</script>
</body>
</html>

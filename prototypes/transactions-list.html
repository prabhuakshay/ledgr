<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers "How does the Transactions list work?" (issue #6).
  Three structurally different Transactions pages on prototype G's look and navigation A, with 250 generated Transactions:
    A  Day boxes: search and filter buttons, a box per day, select by checkbox, scroll loads more. A row opens the editor.
       On phones, C's Filters button and sheet (round 1 pick: A, with C's phone filters).
    B  Table and pane: one search box with qualifiers (account:, tag:, kind:, amount:>), a sortable table, numbered pages,
       and a side pane showing the selected Transaction.
    C  Months and facets: a filter rail with counts, a ledger grouped by month with In / Out totals,
       rows that expand to show their Splits, and one month loaded at a time.
  Bulk actions (Add Tag, Change Account, Delete) are shared by all three. Clicking a row stands in for opening the editor from #5.
  The pink strip switches variant and theme and shows the list's state. Resize below 760px for the phone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledgr transactions list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 6px; }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }

body {
  --bg: light-dark(#ffffff, #000000);
  --subtle: light-dark(#f6f8fa, #0d1117);
  --muted-bg: light-dark(#eff2f5, #151b23);
  --border: light-dark(#d1d9e0, #30363d);
  --border-muted: light-dark(#e3e8ed, #21262d);
  --fg: light-dark(#1f2328, #e6edf3);
  --muted: light-dark(#59636e, #9198a1);
  --faint: light-dark(#818b98, #656c76);
  --accent: light-dark(#0969da, #4493f8);
  --good: light-dark(#1a7f37, #3fb950);
  --bad: light-dark(#d1242f, #f85149);
  --attention: light-dark(#9a6700, #d29922);
  --primary: light-dark(#1f883d, #238636);
  --primary-hover: light-dark(#1c8139, #29903b);
  --btn: light-dark(#f6f8fa, #212830);
  --btn-hover: light-dark(#eff2f5, #262c36);
  --brand-ink: light-dark(#121418, #ece8df);
  --brand-green: light-dark(#13785a, #5fcb9f);
  --shadow: light-dark(0 1px 0 rgba(31,35,40,.04), none);
  --overlay-shadow: light-dark(0 8px 24px rgba(66,74,83,.2), 0 0 0 1px #30363d, 0 16px 32px rgba(0,0,0,.85));
  --page: light-dark(#f2f4f7, #000000);
  --card: light-dark(#ffffff, #0d1117);
  font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5;
  background: var(--bg); color: var(--fg);
  -webkit-font-smoothing: antialiased;
}
.logo { height: 24px; width: auto; display: block; color: var(--brand-ink); flex: none; }
.muted { color: var(--muted); }
.num { white-space: nowrap; flex: none; }
.num .dec { color: var(--muted); }
.box { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.box-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--subtle); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; }
.box-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.box-r { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border-muted); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.box-h + .box-r { border-top: 0; }
.box-r .main { flex: 1; }
.box-r .s { color: var(--muted); font-size: 12px; }
button.box-r:hover { background: var(--subtle); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--btn); color: var(--fg); font-weight: 500; white-space: nowrap; box-shadow: var(--shadow); flex: none; }
.btn:hover { background: var(--btn-hover); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.primary { background: var(--primary); border-color: rgba(31,35,40,.15); color: #fff; }
.btn.primary:hover:not([disabled]) { background: var(--primary-hover); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: transparent; }
.btn.split { border-radius: 6px 0 0 6px; }
.btn.split + .btn { border-radius: 0 6px 6px 0; border-left-color: rgba(255,255,255,.25); padding: 0 6px; }
.link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; font-weight: 500; }
.link:hover { text-decoration: underline; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--btn-hover); color: var(--fg); }
.iconbtn.sm { width: 28px; height: 28px; }
.input { width: 100%; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
.input:focus, .pick:focus-visible { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.input.err, .pick.err { border-color: var(--bad); }
.amt { text-align: right; font-weight: 500; }
kbd { font-family: inherit; font-size: 11px; line-height: 18px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--bg); }
.label { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 4px 0 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 500; white-space: nowrap; }
.label button { border: 0; background: none; padding: 0; color: var(--muted); display: grid; }
.label button svg { width: 12px; height: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hue, var(--muted)); flex: none; }
.fl { display: block; font-weight: 600; margin-bottom: 6px; }
.fl .muted { font-weight: 400; }
.err-t { color: var(--bad); font-size: 12px; margin-top: 4px; }
.hint { color: var(--muted); font-size: 12px; }

/* ---------- background page ---------- */
.hdr { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: var(--subtle); border-bottom: 1px solid var(--border); }
.hdr .crumb { font-weight: 600; display: flex; gap: 8px; }
.hdr .sp { flex: 1; }
.hdr .fake-search { width: 280px; height: 32px; border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); background: var(--bg); }
.hdr .fake-search kbd { margin-left: auto; }
.rel { position: relative; display: flex; flex-direction: column; }
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; max-width: 1200px; margin: 0 auto; padding: 24px; }
.side h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 8px 4px; }
.side h4:first-child { margin-top: 0; }
.side a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); position: relative; }
.side a.on { background: var(--muted-bg); font-weight: 600; }
.side a.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px; border-radius: 6px; background: var(--accent); }
.side a svg { color: var(--muted); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border-muted); }
.ph h1 { margin: 0; font-size: 24px; font-weight: 400; }
.txr .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--subtle); border: 1px solid var(--border); color: var(--muted); flex: none; }
.txr.new { background: color-mix(in srgb, var(--good) 8%, transparent); }
@media (max-width: 1000px) { .shell { grid-template-columns: 1fr; } .side { display: none; } }

.mob, .mtabs { display: none; }
@media (max-width: 760px) {
  body { background: var(--page); padding-bottom: 80px; }
  .desk { display: none; }
  .mob { display: block; }
  .mtabs { display: grid; }
}
.mbar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; }
.mtitle { padding: 2px 20px 14px; }
.mtitle h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.mcard { margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid light-dark(transparent, var(--border-muted)); overflow: hidden; }
.mrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; position: relative; width: 100%; border: 0; background: none; text-align: left; }
.mrow + .mrow::before { content: ""; position: absolute; top: 0; right: 0; left: 60px; border-top: 1px solid var(--border-muted); }
.mrow .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: #59636e; flex: none; }
.mrow .main { flex: 1; }
.mrow .t { font-size: 15px; font-weight: 500; }
.mrow .s { color: var(--muted); font-size: 13px; }
.mtabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); }
.mtabs a, .mtabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; font-size: 11px; font-weight: 500; color: var(--muted); border: 0; background: none; }
.mtabs a.on { color: var(--fg); font-weight: 600; }
.mtabs a svg { width: 22px; height: 22px; }
.mtabs .plus span { width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; margin-top: -18px; }
.mtabs .plus svg { width: 24px; height: 24px; }

/* ---------- dialog ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: light-dark(rgba(31,35,40,.5), rgba(1,4,9,.8)); }
.dlg { position: fixed; z-index: 61; top: 96px; left: 50%; transform: translateX(-50%); width: min(var(--w, 720px), calc(100% - 32px)); max-height: calc(100vh - 120px); display: flex; flex-direction: column; background: var(--bg); border-radius: 12px; box-shadow: var(--overlay-shadow); }
.dh { display: flex; align-items: center; gap: 4px; padding: 12px 8px 12px 16px; border-bottom: 1px solid var(--border-muted); }
.dh .t { flex: 1; }
.dh h2 { margin: 0; font-size: 14px; font-weight: 600; }
.db { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.df { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border-muted); }
.df .tot { flex: 1; display: flex; align-items: baseline; gap: 8px; }
.df .tot .num { font-size: 16px; font-weight: 600; }
.df .keys { font-size: 12px; color: var(--muted); margin-right: 8px; }
.df.confirm { background: color-mix(in srgb, var(--bad) 6%, transparent); border-radius: 0 0 12px 12px; }
.df.confirm .msg { flex: 1; }
.top { display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--attention) 40%, transparent); background: color-mix(in srgb, var(--attention) 8%, transparent); font-size: 13px; }
.note svg { color: var(--attention); margin-top: 2px; }
.files { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.file { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
.file svg { color: var(--muted); }
.file button { border: 0; background: none; color: var(--muted); display: grid; padding: 2px; }
.file button svg { width: 14px; height: 14px; }
.hist summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.hist summary::-webkit-details-marker { display: none; }
.hist[open] summary svg { transform: rotate(90deg); }
.hist ol { margin: 8px 0 0; padding: 0 0 0 16px; border-left: 2px solid var(--border-muted); list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.hist li .when { color: var(--muted); margin-left: 6px; }

/* ---------- pickers ---------- */
.pick { width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); text-align: left; }
.pick .ph-t { color: var(--muted); flex: 1; }
.pick .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick > svg:last-child { color: var(--muted); }
.pop { position: absolute; z-index: 70; left: 0; top: calc(100% + 4px); width: max(100%, 300px); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--overlay-shadow); overflow: hidden; }
.pop.right { left: auto; right: 0; }
.pop .pi { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border-muted); color: var(--muted); }
.pop .pi input { flex: 1; height: 40px; border: 0; background: none; color: var(--fg); }
.pop .pi input:focus { outline: none; }
.pop .pl { max-height: 300px; overflow-y: auto; padding: 6px; }
.pop h5 { margin: 6px 8px 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
.pop .opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: none; text-align: left; }
.pop .opt.hi { background: var(--muted-bg); }
.pop .opt .s { margin-left: auto; color: var(--muted); font-size: 12px; }
.pop .opt.create { color: var(--accent); }
.pop .opt .chk { width: 16px; color: var(--accent); }
.pop .pf { padding: 6px 12px; border-top: 1px solid var(--border-muted); font-size: 12px; color: var(--muted); }
.ptop { display: none; }
@media (max-width: 760px) {
  .pop { position: fixed; left: 0; right: 0; bottom: 0; top: 96px; width: auto; border-radius: 14px 14px 0 0; border: 0; display: flex; flex-direction: column; background: var(--page); }
  .pop .pi { margin: 12px 16px 4px; border: 0; border-radius: 10px; background: var(--muted-bg); }
  .pop .pi input { font-size: 16px; }
  .pop .pl { max-height: none; flex: 1; padding: 0 16px 24px; }
  .pop h5 { margin: 16px 4px 6px; font-size: 13px; }
  .pop .opt { min-height: 48px; font-size: 16px; background: var(--card); border-radius: 0; border-top: 1px solid var(--border-muted); }
  .pop .opt.hi { background: var(--card); }
  .pop .pf { display: none; }
  .ptop { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 0; font-weight: 600; font-size: 17px; }
  .ptop button { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 0; }
}

/* ---------- state panel and toast ---------- */
.state { position: fixed; z-index: 90; right: 12px; bottom: 12px; width: 340px; max-height: 50vh; overflow: auto; background: #1f2328; color: #e6edf3; border-radius: 8px; padding: 10px 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; box-shadow: 0 8px 24px rgba(0,0,0,.4); margin: 0; white-space: pre-wrap; }
.state b { color: #ff7bb0; font-weight: 600; }
.state .bad { color: #ff8182; }
.state .ok { color: #7ee787; }
.toast { position: fixed; z-index: 80; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--fg); color: var(--bg); font-weight: 500; box-shadow: var(--overlay-shadow); white-space: nowrap; }
@media (max-width: 760px) { .toast { bottom: 96px; } .state { left: 12px; right: 12px; width: auto; bottom: 88px; } }

/* ---------- prototype strip (not part of any design) ---------- */
body { padding-top: 40px; }
.proto { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 40px; display: flex; align-items: center; justify-content: safe center; gap: 6px; padding: 0 8px; background: #ff3d8b; color: #fff; font: 600 13px/1 system-ui, sans-serif; white-space: nowrap; overflow-x: auto; }
.proto button, .proto select { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 6px; height: 28px; padding: 0 10px; font: inherit; flex: none; }
.proto select option { color: #000; }
.proto .sep { width: 1px; height: 20px; background: rgba(255,255,255,.4); margin: 0 4px; flex: none; }

/* ---------- shared list pieces ---------- */
.shell.wide { max-width: 1440px; }
.ph .count { color: var(--muted); font-size: 14px; margin-left: 8px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; height: 32px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; background: var(--bg); color: var(--muted); }
.search:focus-within { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.search input { flex: 1; border: 0; background: none; height: 30px; color: var(--fg); }
.search input:focus { outline: none; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.cnt { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--muted-bg); color: var(--fg); font-size: 12px; font-weight: 500; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.summary { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.summary b { color: var(--fg); font-weight: 600; }
.kic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--hue, var(--muted)); background: color-mix(in srgb, var(--hue, var(--muted)) 14%, transparent); }
.kic svg { width: 16px; height: 16px; }
.amt-spent { color: var(--fg); }
.amt-received, .amt-refund { color: var(--good); }
.amt-transfer { color: var(--muted); }
.amt-transfer .dec { color: var(--faint); }
.t-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-sub { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; }
.t-sub .acc { overflow: hidden; text-overflow: ellipsis; }
.t-sub svg { width: 13px; height: 13px; }
.t-sub .label { height: 18px; padding: 0 6px; font-size: 11px; }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.bulk { position: sticky; top: 8px; z-index: 20; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 12px; border: 1px solid var(--accent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 8%, var(--bg)); box-shadow: var(--overlay-shadow); }
.bulk .what { flex: 1; font-weight: 600; display: flex; gap: 12px; align-items: center; }
.bulk .what .link { font-weight: 500; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--fg); margin: 8px 0 4px; font-size: 16px; font-weight: 600; }
.pop .opt input[type="checkbox"] { pointer-events: none; }
.pop .body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pop .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pop .presets { display: flex; flex-wrap: wrap; gap: 6px; }
.pop .presets .btn { height: 28px; font-size: 13px; }
.pop .pfoot { display: flex; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--border-muted); }

/* ---------- A: day boxes ---------- */
.day { margin-bottom: 16px; }
.day .box-h { padding: 8px 16px; }
.day .box-h h3 { display: flex; gap: 8px; align-items: center; }
.day .box-h .rel-d { color: var(--muted); font-weight: 400; }
.day .box-h .net { font-size: 12px; color: var(--muted); display: flex; gap: 12px; }
.arow { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-top: 1px solid var(--border-muted); cursor: pointer; }
.day .box-h + .arow { border-top: 0; }
.arow:hover { background: var(--subtle); }
.arow.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.arow .main { flex: 1; }
.arow:last-child { border-radius: 0 0 6px 6px; }
.more { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }

/* ---------- B: table and pane ---------- */
.bgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.bgrid.pane-open { grid-template-columns: minmax(0, 1fr) 380px; }
.qwrap { position: relative; flex: 1 1 400px; }
.qwrap .search { width: 100%; }
.qwrap .search input { font-size: 13px; }
.qerr { color: var(--attention); font-size: 12px; margin: -6px 0 10px; display: flex; gap: 6px; align-items: center; }
.qsug { position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 4px); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--overlay-shadow); padding: 6px; }
.qsug button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 6px 8px; border: 0; background: none; border-radius: 6px; text-align: left; }

// ---------- filters, shared by every variant ----------
const blankF = () => ({ q: "", accts: [], parties: [], tags: [], kinds: [], from: "", to: "", min: "", max: "" });
const PRESETS = { "This month": ["2026-10-01", today], "Last month": ["2026-09-01", "2026-09-30"], "Last 3 months": ["2026-07-17", today], "Since 1 April": ["2026-04-01", today] };
function matches(t, f) {
  if (f.q) {
    const q = f.q.toLowerCase();
    const hay = [title(t), t.note, accLine(t), ...tagsOf(t).map((k) => TAGS[k]), String(total(t))].join(" ").toLowerCase();
    if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
  }
  if (f.accts.length && !acctsOf(t).some((a) => f.accts.includes(a))) return false;
  if (f.parties.length && !f.parties.includes(t.party)) return false;
  if (f.tags.length && !tagsOf(t).some((k) => f.tags.includes(k))) return false;
  if (f.kinds.length && !f.kinds.includes(kind(t))) return false;
  if (f.from && t.date < f.from) return false;
  if (f.to && t.date > f.to) return false;
  const n = total(t);
  if (f.min !== "" && n < +f.min) return false;
  if (f.max !== "" && n > +f.max) return false;

}
const byDate = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);

// ---------- B's search box: free text plus qualifiers ----------
const QKEYS = { account: "accts", party: "parties", tag: "tags", kind: "kinds", date: "date", amount: "amount" };
const quote = (s) => (/\s/.test(s) ? `"${s}"` : s);
function toQuery(f) {
  const p = [];
  f.accts.forEach((v) => p.push(`account:${quote(ACC[v].n)}`));
  f.parties.forEach((v) => p.push(`party:${quote(PARTY[v])}`));
  f.tags.forEach((v) => p.push(`tag:${quote(TAGS[v])}`));
  f.kinds.forEach((v) => p.push(`kind:${v}`));
  if (f.from || f.to) p.push(`date:${f.from || "*"}..${f.to || "*"}`);
  if (f.min !== "" && f.max !== "") p.push(`amount:${f.min}..${f.max}`);
  else if (f.min !== "") p.push(`amount:>${f.min}`);
  else if (f.max !== "") p.push(`amount:<${f.max}`);
  if (f.q) p.push(f.q);
  return p.join(" ");
}
function parseQuery(s) {
  const f = blankF(), words = [], bad = [];
  const find = (dict, v) => Object.keys(dict).filter((k) => (typeof dict[k] === "string" ? dict[k] : dict[k].n).toLowerCase().includes(v.toLowerCase()));
  for (const m of s.matchAll(/(\w+):("([^"]*)"?|\S*)|("([^"]*)"?|\S+)/g)) {
    if (!m[1]) { words.push(m[5] ?? m[4]); continue; }
    const key = m[1].toLowerCase(), v = m[3] ?? m[2];
    if (!v) continue;
    if (key === "account") { const ids = find(ACC, v); ids.length ? f.accts.push(...ids) : bad.push(`No Account matches “${v}”`); }
    else if (key === "party") { const ids = find(PARTY, v); ids.length ? f.parties.push(...ids) : bad.push(`No Party matches “${v}”`); }
    else if (key === "tag") { const ids = find(TAGS, v); ids.length ? f.tags.push(...ids) : bad.push(`No Tag matches “${v}”`); }
    else if (key === "kind") { const k = Object.keys(TX_T).find((x) => x.startsWith(v.toLowerCase())); k ? f.kinds.push(k) : bad.push(`kind: takes spent, received, transfer or refund`); }
    else if (key === "date") {
      if (/^\d{4}-\d{2}$/.test(v)) { f.from = v + "-01"; f.to = v + "-31"; }
      else if (v.includes("..")) { const [a, b] = v.split(".."); f.from = a === "*" ? "" : a; f.to = b === "*" ? "" : b; }
      else if (v.startsWith(">")) f.from = v.slice(1);
      else if (v.startsWith("<")) f.to = v.slice(1);
      else { f.from = v; f.to = v; }
    } else if (key === "amount") {
      const n = (x) => x.replace(/[₹,k]/gi, (c) => (c.toLowerCase() === "k" ? "000" : ""));
      if (v.includes("..")) { const [a, b] = v.split(".."); f.min = n(a); f.max = n(b); }
      else if (v.startsWith(">")) f.min = n(v.slice(1));
      else if (v.startsWith("<")) f.max = n(v.slice(1));
      else { f.min = n(v); f.max = n(v); }
    } else words.push(m[0]);
  }
  f.accts = uniq(f.accts); f.parties = uniq(f.parties); f.tags = uniq(f.tags); f.kinds = uniq(f.kinds);
  f.q = words.filter(Boolean).join(" ");

}

    body = `<div class="fldrow"><label><span class="fl">Replace</span><select class="input" data-k="bfrom">${used.map((id) => `<option value="${id}" ${id === state.bulkFrom ? "selected" : ""}>${ACC[id].n}</option>`).join("")}</select></label><span class="arrow">${ic("arrow-right")}</span><label><span class="fl">With</span><select class="input" data-k="bto">${targets.map((id) => `<option value="${id}" ${id === state.bulkTo ? "selected" : ""}>${ACC[id].n}</option>`).join("")}</select></label></div>
      <div class="hint">Changes ${hit.length} Split${hit.length === 1 ? "" : "s"} in ${txs.filter((t) => t.splits.some((s) => s.from === state.bulkFrom || s.to === state.bulkFrom)).length} Transactions. Only ${KIND_T[fk]} Accounts are offered, so no Transaction changes kind.</div>
      ${self ? `<div class="note">${ic("triangle-alert")}<div>${self} Split${self === 1 ? "" : "s"} would move money from ${ACC[state.bulkTo].n} to itself, so ${self === 1 ? "it is" : "they are"} left alone.</div></div>` : ""}
      ${recWarn(txs.filter((t) => acctsOf(t).includes(state.bulkFrom)), [state.bulkFrom, state.bulkTo])}`;
    foot = `<button class="btn" data-bulkclose>Cancel</button><button class="btn primary" data-bulkdo ${state.bulkTo ? "" : "disabled"}>Change ${hit.length - self} Split${hit.length - self === 1 ? "" : "s"}</button>`;
  } else {
    const files = txs.reduce((a, t) => a + t.files.length, 0);
    h = `Delete ${n} Transaction${n === 1 ? "" : "s"}?`;
    body = `<div>${n === 1 ? esc(title(txs[0])) + `, ${fmtDate(txs[0].date)}, ` : `They total ${short(txs.reduce((a, t) => a + total(t), 0))} across ${uniq(txs.map((t) => t.date)).length} days and `}${n === 1 ? "is" : "are"} removed from every Balance.${files ? ` Their ${files} Attachment${files === 1 ? "" : "s"} ${files === 1 ? "is" : "are"} deleted too.` : ""}</div>${recWarn(txs)}`;
    foot = `<button class="btn" data-bulkclose>Cancel</button><button class="btn danger solid" data-bulkdo>Delete ${n} Transaction${n === 1 ? "" : "s"}</button>`;
  }
  return `<div class="scrim" data-bulkclose></div><div class="dlg bulkdlg" style="--w:480px"><div class="dh"><div class="t"><h2>${h}</h2></div><button class="iconbtn" data-bulkclose aria-label="Close">${ic("x")}</button></div><div class="db" style="gap:12px">${body}</div><div class="df" style="justify-content:flex-end">${foot}</div></div>`;
}
function doBulk() {
  const txs = selTx(), before = structuredClone(TXS), n = txs.length;
  let msg;
  if (state.bulk === "tag") {
    txs.forEach((t) => t.splits.forEach((s) => Object.entries(state.bulkTags).forEach(([k, v]) => {
      if (v === "all" && !s.tags.includes(k)) s.tags.push(k);
      if (v === "none") s.tags = s.tags.filter((x) => x !== k);
    })));
    msg = `Tags changed on ${n} Transactions`;
  } else if (state.bulk === "acct") {
    let c = 0;
    txs.forEach((t) => t.splits.forEach((s) => {
      if (s.from === state.bulkFrom && s.to !== state.bulkTo) { s.from = state.bulkTo; c++; }
      if (s.to === state.bulkFrom && s.from !== state.bulkTo) { s.to = state.bulkTo; c++; }
    }));
    msg = `${c} Splits moved from ${ACC[state.bulkFrom].n} to ${ACC[state.bulkTo].n}`;
  } else {
    TXS = TXS.filter((t) => !state.sel.has(t.id));
    if (state.sel.has(state.cur)) state.cur = null;
    msg = `${n} Transaction${n === 1 ? "" : "s"} deleted`;
  }
  state.sel.clear(); state.mSelect = false; state.bulk = null;
  flash(msg, before);
}

// ---------- state panel ----------
function statePanel() {
  const list = results(), f = state.f;
  const show = (k, v) => (v && (!Array.isArray(v) || v.length) ? `${k.padEnd(8)}${Array.isArray(v) ? v.join(", ") : v}\n` : "");
  const paging = state.variant === "A" ? `loaded  ${Math.min(state.shown, list.length)} of ${list.length} (40 more on scroll)` : state.variant === "B" ? `page    ${state.page} of ${Math.ceil(list.length / PAGE) || 1} (${PAGE} a page), sort ${state.sort.k} ${state.sort.dir < 0 ? "desc" : "asc"}\nopen    ${state.cur ? title(TXS.find((t) => t.id === state.cur) || {}) : "—"}` : `months  ${state.months} shown`;
  return `<pre class="state"><b>Filters</b>
${show("text", f.q)}${show("account", f.accts.map((a) => ACC[a].n))}${show("party", f.parties.map((p) => PARTY[p]))}${show("tag", f.tags.map((t) => TAGS[t]))}${show("kind", f.kinds)}${show("date", f.from || f.to ? `${f.from || "start"} .. ${f.to || "today"}` : "")}${show("amount", f.min !== "" || f.max !== "" ? `${f.min || 0} .. ${f.max || "∞"}` : "")}${anyFilter() ? "" : "  none\n"}<b>Query</b>  ${esc(toQuery(f)) || "—"}
<b>Matches</b> ${list.length} of ${TXS.length}
${paging}
<b>Selected</b> ${state.sel.size}${state.sel.size ? `  (${selTx().slice(0, 4).map((t) => title(t)).join(", ")}${state.sel.size > 4 ? ", …" : ""})` : ""}</pre>`;
}

// ---------- render ----------
let io;
function render() {
  const a = document.activeElement, key = a?.dataset?.k;
  let sel = null; try { sel = key ? [a.selectionStart, a.selectionEnd] : null; } catch {}
  const root = document.documentElement;
  if (state.theme === "system") delete root.dataset.theme; else root.dataset.theme = state.theme;
  const page = { A: variantA, B: variantB, C: variantC }[state.variant]();
  const toast = state.toast ? `<div class="toast">${ic("check")}${state.toast}${state.undo ? `<button class="link" data-undo>Undo</button>` : ""}</div>` : "";
  document.getElementById("app").innerHTML = page + (state.bulk ? bulkDialog() : "") + toast + (state.showState ? statePanel() : "");
  window.lucide?.createIcons();
  const themes = { system: "Auto", light: "Light", dark: "Dark" };
  document.getElementById("proto").innerHTML = `
    <button data-p="prev" aria-label="Previous variant">‹</button>
    <select data-p="pick" aria-label="Variant">${Object.entries(VARIANTS).map(([k, n]) => `<option value="${k}" ${k === state.variant ? "selected" : ""}>${k}: ${n}</option>`).join("")}</select>
    <button data-p="next" aria-label="Next variant">›</button><span class="sep"></span>
    <button data-p="state">${state.showState ? "Hide" : "Show"} state</button><button data-p="theme">${themes[state.theme]}</button><button data-p="reset">Reset data</button>`;
  if (key) {
    const el = [...document.querySelectorAll(`[data-k="${key}"]`)].find((e) => e.offsetParent) || document.querySelector(`[data-k="${key}"]`);
    if (el) { el.focus(); try { if (sel) el.setSelectionRange(...sel); } catch {} }
  } else if (state.pop) [...document.querySelectorAll('[data-k="fq"]')].find((e) => e.offsetParent)?.focus();
  io?.disconnect();
  const more = [...document.querySelectorAll("#more")].find((e) => e.offsetParent);
  if (more) { io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { state.shown += 40; render(); } }); io.observe(more); }
  const p = new URLSearchParams({ variant: state.variant });
  if (state.theme !== "system") p.set("theme", state.theme);
  history.replaceState(null, "", "?" + p);
}
function flash(msg, undo) {
  state.toast = msg; state.undo = undo || null; render();
  clearTimeout(flash.t); flash.t = setTimeout(() => { state.toast = state.undo = null; render(); }, undo ? 6000 : 2600);
}
function openEditor(id) {
  if (id === "new") return flash("Would open the new Transaction editor");
  const t = TXS.find((x) => x.id === +id);
  flash(`Would open the editor for ${title(t)}, ${fmtDate(t.date)}`);
}
function cycle(step) {
  const keys = Object.keys(VARIANTS);
  state.variant = keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length];
  state.pop = null; state.qs = toQuery(state.f); state.qbad = []; state.mFilters = false;
  render();
}
function applyQuery() { const { f, bad } = parseQuery(state.qs); state.qbad = bad; setF(f); }
function syncQs() { state.qs = toQuery(state.f); state.qbad = []; }
function toggleSel(id) { state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id); }

document.addEventListener("change", (e) => {
  const p = e.target.dataset.p;
  if (p === "pick") { state.variant = e.target.value; cycle(0); e.target.blur(); }
  const k = e.target.dataset.k;
  if (k === "bfrom") { state.bulkFrom = e.target.value; render(); }
  if (k === "bto") { state.bulkTo = e.target.value; render(); }
  if (k === "from" || k === "to") { state.f[k] = e.target.value; resetPaging(); syncQs(); render(); }
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset.k; if (!k) return;
  const v = e.target.value;
  if (k === "q") { state.f.q = v; resetPaging(); }
  else if (k === "qs") { state.qs = v; state.qhi = 0; applyQuery(); }
  else if (k === "fq") state.fq = v;
  else if (k === "min" || k === "max") { state.f[k] = v.replace(/[^\d.]/g, ""); resetPaging(); syncQs(); }
  else return;
  render();
});
document.addEventListener("focusin", (e) => { if (e.target.dataset?.k === "qs" && !state.qfocus) { state.qfocus = true; render(); } });
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href='#']"); if (a) e.preventDefault();
  const d = (s) => e.target.closest(s);
  const p = d("button[data-p]")?.dataset.p;
  if (p === "prev") return cycle(-1);
  if (p === "next") return cycle(1);
  if (p === "theme") { state.theme = { system: "light", light: "dark", dark: "system" }[state.theme]; return render(); }
  if (p === "state") { state.showState = !state.showState; return render(); }
  if (p === "reset") { TXS = structuredClone(ORIGINAL); state.sel.clear(); state.f = blankF(); syncQs(); resetPaging(); return render(); }
  if (p) return;
  if (state.qfocus && !d(".qwrap")) state.qfocus = false;
  const ins = d("[data-ins]");
  if (ins) {
    state.qs = state.qs.replace(/(\S+)$/, "") + ins.dataset.ins; applyQuery(); render();
    const el = document.querySelector('.desk [data-k="qs"]'); el?.focus(); el?.setSelectionRange(state.qs.length, state.qs.length); return;
  }
  if (d("[data-undo]")) { TXS = state.undo; state.toast = state.undo = null; return render(); }
  // bulk dialog
  if (d("[data-bulkclose]")) { state.bulk = null; return render(); }
  if (d("[data-bulkdo]")) return doBulk();
  const tri = d("[data-tri]");
  if (tri) { const k = tri.dataset.tri, cur = tri.dataset.cur, v = state.bulkTags[k] || cur; const nx = cur === "some" ? { some: "all", all: "none", none: "some" }[v] : v === "all" ? "none" : "all"; nx === cur ? delete state.bulkTags[k] : (state.bulkTags[k] = nx); return render(); }
  const bk = d("[data-bulk]"); if (bk) { state.bulk = bk.dataset.bulk; state.bulkTags = {}; state.pop = null; return render(); }
  // popovers
  if (d("[data-closepop]")) { state.pop = null; return render(); }
  const po = d("[data-pop]"); if (po) { state.pop = state.pop === po.dataset.pop ? null : po.dataset.pop; state.fq = ""; return render(); }
  const fo = d("[data-fopt]");
  if (fo) { const [k, v] = fo.dataset.fopt.split(":"); const arr = state.f[k]; arr.includes(v) ? arr.splice(arr.indexOf(v), 1) : arr.push(v); resetPaging(); syncQs(); return render(); }
  const pr = d("[data-preset]"); if (pr) { [state.f.from, state.f.to] = PRESETS[pr.dataset.preset]; resetPaging(); syncQs(); return render(); }
  const cf = d("[data-clearf]");
  if (cf) { const k = cf.dataset.clearf; if (k === "date") state.f.from = state.f.to = ""; else if (k === "amount") state.f.min = state.f.max = ""; else state.f[k] = []; resetPaging(); syncQs(); return render(); }
  if (state.pop && !d(".pop")) { state.pop = null; render(); }
  const uc = d("[data-unchip]");
  if (uc) { const [k, v] = uc.dataset.unchip.split(":"); if (k === "date") state.f.from = state.f.to = ""; else if (k === "amount") state.f.min = state.f.max = ""; else state.f[k] = state.f[k].filter((x) => x !== v); resetPaging(); syncQs(); return render(); }
  if (d("[data-clearall]")) { setF(blankF()); syncQs(); return render(); }
  const fp = d("[data-filterparty]"); if (fp) { setF({ ...blankF(), parties: [fp.dataset.filterparty] }); syncQs(); state.cur = null; return render(); }
  // selection
  const sb = d("[data-sel]"); if (sb) { toggleSel(+sb.dataset.sel); return render(); }
  if (d("[data-selnone]")) { state.sel.clear(); return render(); }
  if (d("[data-selmatch]")) { results().forEach((t) => state.sel.add(t.id)); return render(); }
  if (d("[data-selpage]")) { const rows = sorted(results()).slice((state.page - 1) * PAGE, state.page * PAGE); const all = rows.every((t) => state.sel.has(t.id)); rows.forEach((t) => (all ? state.sel.delete(t.id) : state.sel.add(t.id))); return render(); }
  if (d("[data-selall]")) { results().forEach((t) => state.sel.add(t.id)); return render(); }
  if (d("[data-mselect]")) { state.mSelect = !state.mSelect; if (!state.mSelect) state.sel.clear(); return render(); }
  // B
  const so = d("[data-sort]"); if (so) { const k = so.dataset.sort; state.sort = { k, dir: state.sort.k === k ? -state.sort.dir : k === "party" ? 1 : -1 }; state.page = 1; return render(); }
  const pg = d("[data-page]"); if (pg && !pg.disabled) { state.page = +pg.dataset.page; scrollTo(0, 0); return render(); }
  if (d("[data-closepane]")) { state.cur = null; return render(); }
  // C
  if (d("[data-moremonth]")) { state.months++; return render(); }
  const sa = d("[data-showall]"); if (sa) { state.showAll[sa.dataset.showall] = !state.showAll[sa.dataset.showall]; return render(); }
  if (d("[data-mfilters]")) { state.mFilters = !state.mFilters; return render(); }
  // rows and actions
  const ed = d("[data-edit]"); if (ed) return openEditor(ed.dataset.edit);
  const act = d("[data-act]")?.dataset.act;
  if (act === "schedule") return flash("Would open a new Schedule filled in from this Transaction");
  if (act === "delone") { state.sel = new Set([state.cur]); state.bulk = "delete"; return render(); }
  const mr = d("[data-mrow]");
  if (mr) {
    const id = +mr.dataset.mrow;
    if (state.mSelect) toggleSel(id);
    else if (state.variant === "B") state.cur = id;
    else if (state.variant === "C") state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    else return openEditor(id);
    return render();
  }
  const cu = d("[data-cur]"); if (cu) { state.cur = +cu.dataset.cur; return render(); }
  if (d("[data-stop]")) return;
  const tg = d("[data-toggle]");
  if (tg) { const id = +tg.dataset.toggle; if (state.sel.size) toggleSel(id); else state.open.has(id) ? state.open.delete(id) : state.open.add(id); return render(); }
  if (state.qfocus) render();
});
document.addEventListener("dblclick", (e) => { const cu = e.target.closest("tr[data-cur]"); if (cu) openEditor(cu.dataset.cur); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.bulk) { state.bulk = null; return render(); }
    if (state.pop) { state.pop = null; return render(); }
    if (state.qfocus) { state.qfocus = false; e.target.blur(); return render(); }
    if (state.mFilters) { state.mFilters = false; return render(); }
    if (state.sel.size) { state.sel.clear(); return render(); }
    if (state.cur) { state.cur = null; return render(); }
  }
  if (e.target.dataset?.k === "qs" && state.qfocus) {
    const sug = suggestions(state.qs);
    if (e.key === "ArrowDown") { e.preventDefault(); state.qhi = Math.min(sug.length - 1, state.qhi + 1); return render(); }
    if (e.key === "ArrowUp") { e.preventDefault(); state.qhi = Math.max(0, state.qhi - 1); return render(); }
    if (e.key === "Tab" && sug[state.qhi]) { e.preventDefault(); state.qs = state.qs.replace(/(\S+)$/, "") + sug[state.qhi].ins; applyQuery(); render(); return e.target.isConnected || document.querySelector('.desk [data-k="qs"]').setSelectionRange(state.qs.length, state.qs.length); }
    if (e.key === "Enter") { state.qfocus = false; e.target.blur(); return render(); }
  }
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "/") { e.preventDefault(); const el = [...document.querySelectorAll('[data-k="q"], [data-k="qs"]')].find((x) => x.offsetParent); return el?.focus(); }
  if (state.variant === "B" && "jkx".includes(e.key) && e.key.length === 1 || state.variant === "B" && e.key === "Enter") {
    const rows = sorted(results()).slice((state.page - 1) * PAGE, state.page * PAGE), i = rows.findIndex((t) => t.id === state.cur);
    if (e.key === "Enter" && state.cur) return openEditor(state.cur);
    if (e.key === "x" && state.cur) { toggleSel(state.cur); return render(); }
    if (e.key === "j") state.cur = rows[Math.min(rows.length - 1, i + 1)]?.id;
    if (e.key === "k") state.cur = rows[Math.max(0, i - 1)]?.id;
    render(); return document.querySelector("tr.cur")?.scrollIntoView({ block: "nearest" });
  }
  if (e.key.toLowerCase() === "n" && !e.ctrlKey && !e.metaKey) return openEditor("new");
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
let lastPhone = phone();
addEventListener("resize", () => { if (phone() !== lastPhone) { lastPhone = phone(); render(); } });

render();
</script>
</body>
